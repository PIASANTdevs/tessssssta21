<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HLS Плеер</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<style>
  body { margin: 0; background: #0a0d14; color: #fff; font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; }
  .player { position: relative; width: 100%; max-width: 1000px; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 30px 70px rgba(0,0,0,.7); }
  video { width: 100%; height: 100%; display: block; background: #000; }
  .info { position: absolute; top: 12px; left: 12px; padding: 6px 12px; background: rgba(0,0,0,.7); border-radius: 6px; font-size: 12px; z-index: 5; }
  .controls { position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 16px 12px; background: linear-gradient(to top, rgba(0,0,0,.9), transparent); display: flex; align-items: center; gap: 10px; }
  .btn { width: 40px; height: 40px; border: none; background: transparent; color: #fff; cursor: pointer; border-radius: 8px; display: grid; place-items: center; }
  .btn:hover { background: rgba(255,255,255,.12); }
  .btn svg { width: 22px; height: 22px; fill: currentColor; }
  .time { font-size: 13px; font-variant-numeric: tabular-nums; }
  .spacer { flex: 1; }
  input[type=range] { width: 100px; }
</style>
</head>
<body>

<div class="player" id="player">
  <video id="video" playsinline controls></video>
  <div class="info" id="info">Загрузка…</div>
</div>

<script>
const VIDEO_URL = 'https://vn10001.mvapspdmpg.com/1790461198/nlAP7MdkS3oVwmB6Ej06tw/anon/a15b46f7-5b1f-4ff6-8ddf-95c4d376caea/movies/files/episodes/62716/C579otDsoB5uEOcMk.mp4/index-a1.m3u8';

const video = document.getElementById('video');
const info = document.getElementById('info');

function log(msg) {
  console.log(msg);
  info.textContent = msg;
}

if (window.Hls && Hls.isSupported()) {
  const hls = new Hls({ enableWorker: true });

  hls.loadSource(VIDEO_URL);
  hls.attachMedia(video);

  hls.on(Hls.Events.MANIFEST_PARSED, (evt, data) => {
    log('Манифест загружен. Уровней: ' + data.levels.length);
    console.log('Уровни:', data.levels);
    // Проверяем, есть ли видео-кодек
    const hasVideo = data.levels.some(lv => lv.videoCodec);
    const hasAudio = data.levels.some(lv => lv.audioCodec);
    console.log('Есть видео:', hasVideo, '| Есть аудио:', hasAudio);
    info.textContent = 'Видео: ' + (hasVideo ? 'да' : 'НЕТ') + ' | Аудио: ' + (hasAudio ? 'да' : 'НЕТ');
    video.play().catch(()=>{});
  });

  hls.on(Hls.Events.LEVEL_LOADED, (evt, data) => {
    console.log('Уровень загружен:', data.details);
  });

  hls.on(Hls.Events.ERROR, (evt, data) => {
    console.error('Ошибка HLS:', data);
    if (data.fatal) {
      log('Фатальная ошибка: ' + data.details);
    }
  });

} else if (video.canPlayType('application/vnd.apple.mpegurl')) {
  video.src = VIDEO_URL;
  log('Нативный HLS (Safari)');
} else {
  log('HLS не поддерживается');
}

video.addEventListener('loadedmetadata', () => {
  console.log('Метаданные:', {
    videoWidth: video.videoWidth,
    videoHeight: video.videoHeight,
    duration: video.duration,
  });
  info.textContent = `Размер: ${video.videoWidth}×${video.videoHeight} | Длительность: ${Math.round(video.duration)}с`;
});
</script>
</body>
</html>

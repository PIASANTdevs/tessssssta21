<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кастомный плеер Rutube</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --accent: #4f8cff;
    --accent-2: #8b5cf6;
    --bg: #0a0d14;
    --text: #fff;
    --muted: #a8b3cf;
  }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: radial-gradient(1200px 600px at 50% 0%, #16233d 0%, var(--bg) 70%);
    color: var(--text);
    display: grid; place-items: center;
    min-height: 100vh; padding: 20px;
  }

  .player {
    position: relative;
    width: 100%; max-width: 1200px;
    aspect-ratio: 16/9;
    background: #000;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.06);
    user-select: none;
  }

  video {
    width: 100%; height: 100%; display: block;
    background: #000; object-fit: contain;
  }

  .poster {
    position: absolute; inset: 0;
    background-size: cover;
    background-position: center;
    background-color: #000;
    display: grid; place-items: center;
    z-index: 3;
    transition: opacity .4s;
    cursor: pointer;
  }
  .poster.hide { opacity: 0; pointer-events: none; }
  .poster::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,.8));
  }
  .poster-content { position: relative; z-index: 2; text-align: center; padding: 20px; max-width: 640px; }
  .poster-play {
    width: 96px; height: 96px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: none; cursor: pointer;
    display: grid; place-items: center;
    box-shadow: 0 20px 50px rgba(79,140,255,.5);
    transition: transform .3s;
    margin: 0 auto 20px;
  }
  .poster-play:hover { transform: scale(1.08); }
  .poster-play svg { width: 40px; height: 40px; fill: #fff; margin-left: 6px; }
  .poster-title {
    font-size: 20px; font-weight: 700; margin-bottom: 8px;
    text-shadow: 0 2px 12px rgba(0,0,0,.9); line-height: 1.3;
  }
  .poster-sub { font-size: 13px; color: var(--muted); }

  .loader {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    background: rgba(0,0,0,.6);
    pointer-events: none; opacity: 0;
    transition: opacity .25s; z-index: 5;
  }
  .loader.show { opacity: 1; }
  .loader-spinner {
    width: 56px; height: 56px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.15);
    border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error {
    position: absolute; inset: 0;
    display: none; place-items: center;
    background: rgba(6,9,15,.95);
    text-align: center; padding: 24px; z-index: 8;
  }
  .error.show { display: grid; }
  .error .icon { font-size: 52px; margin-bottom: 12px; }
  .error h3 { font-size: 18px; margin-bottom: 8px; }
  .error p { font-size: 13px; color: var(--muted); max-width: 480px; line-height: 1.5; word-break: break-word; }
  .error .retry {
    margin-top: 16px; padding: 10px 26px; border-radius: 10px; border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: filter .2s, transform .15s;
  }
  .error .retry:hover { filter: brightness(1.1); transform: translateY(-1px); }

  .click-flash {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    width: 80px; height: 80px; border-radius: 50%;
    background: rgba(0,0,0,.55);
    display: grid; place-items: center;
    opacity: 0; pointer-events: none; z-index: 5;
  }
  .click-flash svg { width: 40px; height: 40px; fill: #fff; }
  .click-flash.animate { animation: flashPulse .6s ease forwards; }
  @keyframes flashPulse {
    0% { opacity: 0; transform: translate(-50%,-50%) scale(.6); }
    20% { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%,-50%) scale(1.3); }
  }

  .top-bar {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 16px 18px;
    background: linear-gradient(to bottom, rgba(0,0,0,.8), transparent);
    display: flex; align-items: center; gap: 12px;
    z-index: 6; pointer-events: none;
    opacity: 0; transition: opacity .3s;
  }
  .top-bar.show { opacity: 1; }
  .top-bar .title {
    font-size: 14px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-shadow: 0 1px 3px rgba(0,0,0,.6);
  }

  .controls {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: linear-gradient(to top, rgba(0,0,0,.95) 0%, rgba(0,0,0,.7) 60%, transparent 100%);
    padding: 50px 18px 14px;
    z-index: 7;
    opacity: 0; transform: translateY(6px);
    transition: opacity .3s, transform .3s;
  }
  .controls.show { opacity: 1; transform: translateY(0); }

  .progress-wrap {
    position: relative;
    height: 20px;
    display: flex; align-items: center;
    cursor: pointer;
    margin-bottom: 8px;
  }
  .progress-track {
    position: relative;
    width: 100%; height: 4px;
    background: rgba(255,255,255,.2);
    border-radius: 4px; overflow: hidden;
    transition: height .15s;
  }
  .progress-wrap:hover .progress-track { height: 7px; }
  .progress-buffered {
    position: absolute; top: 0; left: 0; bottom: 0;
    background: rgba(255,255,255,.25);
    width: 0%;
  }
  .progress-played {
    position: absolute; top: 0; left: 0; bottom: 0;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    width: 0%;
  }
  .progress-thumb {
    position: absolute; top: 50%; left: 0;
    width: 14px; height: 14px; border-radius: 50%;
    background: #fff;
    transform: translate(-50%,-50%) scale(0);
    box-shadow: 0 2px 8px rgba(0,0,0,.6);
    transition: transform .15s;
    pointer-events: none;
  }
  .progress-wrap:hover .progress-thumb { transform: translate(-50%,-50%) scale(1); }
  .preview-time {
    position: absolute; bottom: 26px;
    transform: translateX(-50%);
    padding: 4px 10px;
    background: rgba(0,0,0,.9);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 6px;
    font-size: 12px; font-weight: 600;
    color: #fff; opacity: 0;
    transition: opacity .15s;
    pointer-events: none; white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .progress-wrap:hover .preview-time { opacity: 1; }

  .row { display: flex; align-items: center; gap: 10px; }

  .btn {
    width: 40px; height: 40px;
    border: none; background: transparent; color: #fff;
    cursor: pointer; border-radius: 9px;
    display: grid; place-items: center;
    transition: background .15s, transform .1s;
  }
  .btn:hover { background: rgba(255,255,255,.12); }
  .btn:active { transform: scale(.92); }
  .btn svg { width: 22px; height: 22px; fill: currentColor; pointer-events: none; }

  .time {
    font-size: 13px; color: #fff;
    font-variant-numeric: tabular-nums;
    padding: 0 6px;
    letter-spacing: .3px;
  }
  .time .sep { color: rgba(255,255,255,.4); margin: 0 4px; }

  .volume-wrap { display: flex; align-items: center; gap: 4px; }
  .volume-slider {
    -webkit-appearance: none; appearance: none;
    width: 0; height: 4px;
    background: rgba(255,255,255,.25);
    border-radius: 4px; outline: none;
    transition: width .25s; cursor: pointer;
  }
  .volume-wrap:hover .volume-slider,
  .volume-slider:focus { width: 80px; }
  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 13px; height: 13px; border-radius: 50%;
    background: #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,.5);
  }

  .spacer { flex: 1; }

  .quality { position: relative; }
  .quality-btn {
    width: auto; padding: 0 12px; height: 40px;
    font-size: 13px; font-weight: 600;
    display: flex; align-items: center; gap: 6px;
  }
  .quality-menu {
    position: absolute; bottom: 100%; right: 0;
    margin-bottom: 8px; min-width: 90px;
    background: rgba(15,20,30,.96);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 10px; padding: 6px;
    opacity: 0; transform: translateY(6px) scale(.96);
    pointer-events: none; transition: .2s;
    box-shadow: 0 20px 40px rgba(0,0,0,.5);
  }
  .quality-menu.show { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
  .quality-menu .opt {
    padding: 8px 12px; font-size: 13px; font-weight: 600;
    color: #fff; cursor: pointer; border-radius: 6px;
    white-space: nowrap; display: flex; justify-content: space-between; gap: 12px;
  }
  .quality-menu .opt:hover { background: rgba(255,255,255,.08); }
  .quality-menu .opt.active { color: var(--accent); }
  .quality-menu .opt.active::after { content: '✓'; }

  .boot {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    background: rgba(0,0,0,.9); z-index: 12;
    text-align: center; padding: 24px;
    transition: opacity .3s;
  }
  .boot.hide { opacity: 0; pointer-events: none; }
  .boot-spinner {
    width: 44px; height: 44px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.15);
    border-top-color: var(--accent);
    animation: spin .8s linear infinite;
    margin: 0 auto 18px;
  }
  .boot-title { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
  .boot-text { font-size: 12px; color: var(--muted); max-width: 420px; line-height: 1.5; }

  @media (max-width: 600px) {
    body { padding: 10px; }
    .btn { width: 36px; height: 36px; }
    .btn svg { width: 20px; height: 20px; }
    .time { font-size: 12px; }
    .poster-play { width: 72px; height: 72px; }
    .poster-play svg { width: 30px; height: 30px; }
  }
</style>
</head>
<body>

<div class="player" id="player">
  <video id="video" playsinline webkit-playsinline preload="metadata"></video>

  <div class="poster" id="poster">
    <div class="poster-content">
      <button class="poster-play" id="posterPlay">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <div class="poster-title" id="posterTitle">Загрузка…</div>
      <div class="poster-sub">Rutube · без рекламы</div>
    </div>
  </div>

  <div class="boot" id="boot">
    <div>
      <div class="boot-spinner"></div>
      <div class="boot-title" id="bootTitle">Получение видео…</div>
      <div class="boot-text" id="bootText">Обращаемся к API Rutube через CORS-прокси</div>
    </div>
  </div>

  <div class="top-bar" id="topBar">
    <div class="title" id="videoTitle"></div>
  </div>

  <div class="click-flash" id="clickFlash">
    <svg id="flashIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
  </div>

  <div class="loader" id="loader"><div class="loader-spinner"></div></div>

  <div class="error" id="error">
    <div>
      <div class="icon">📡</div>
      <h3 id="errorTitle">Не удалось загрузить</h3>
      <p id="errorText"></p>
      <button class="retry" id="retryBtn">Повторить</button>
    </div>
  </div>

  <div class="controls" id="controls">
    <div class="progress-wrap" id="progressWrap">
      <div class="preview-time" id="previewTime">0:00</div>
      <div class="progress-track">
        <div class="progress-buffered" id="progressBuffered"></div>
        <div class="progress-played" id="progressPlayed"></div>
      </div>
      <div class="progress-thumb" id="progressThumb"></div>
    </div>

    <div class="row">
      <button class="btn" id="playBtn" title="Играть / Пауза (Space)">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>

      <div class="volume-wrap">
        <button class="btn" id="muteBtn" title="Звук (M)">
          <svg id="volIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.47 4.47 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/></svg>
        </button>
        <input type="range" class="volume-slider" id="volume" min="0" max="1" step="0.01" value="1">
      </div>

      <div class="time">
        <span id="curTime">0:00</span>
        <span class="sep">/</span>
        <span id="durTime">0:00</span>
      </div>

      <div class="spacer"></div>

      <div class="quality">
        <button class="btn quality-btn" id="qualityBtn" title="Качество">
          <span id="qLabel">Auto</span>
        </button>
        <div class="quality-menu" id="qualityMenu"></div>
      </div>

      <button class="btn" id="pipBtn" title="Картинка в картинке (P)">
        <svg viewBox="0 0 24 24"><path d="M19 11h-8v6h8v-6zm4 8V5a2 2 0 0 0-2-2H3a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2zm-2 .02H3V4.98h18v14.04z"/></svg>
      </button>

      <button class="btn" id="fsBtn" title="Полный экран (F)">
        <svg id="fsIcon" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   ID ВИДЕО
   Возьми из ссылки rutube.ru/video/XXXXXXXX/
   ========================================================= */
const VIDEO_ID = '48a7dd6b620b30713b614f38c00a4739';

/* =========================================================
   DOM
   ========================================================= */
const video = document.getElementById('video');
const player = document.getElementById('player');
const controls = document.getElementById('controls');
const topBar = document.getElementById('topBar');
const loader = document.getElementById('loader');
const errorBox = document.getElementById('error');
const errorTitle = document.getElementById('errorTitle');
const errorText = document.getElementById('errorText');
const retryBtn = document.getElementById('retryBtn');
const boot = document.getElementById('boot');
const bootTitle = document.getElementById('bootTitle');
const bootText = document.getElementById('bootText');
const poster = document.getElementById('poster');
const posterPlay = document.getElementById('posterPlay');
const posterTitle = document.getElementById('posterTitle');
const videoTitle = document.getElementById('videoTitle');

const playBtn = document.getElementById('playBtn');
const playIcon = document.getElementById('playIcon');
const muteBtn = document.getElementById('muteBtn');
const volIcon = document.getElementById('volIcon');
const volumeEl = document.getElementById('volume');
const progressWrap = document.getElementById('progressWrap');
const progressPlayed = document.getElementById('progressPlayed');
const progressBuffered = document.getElementById('progressBuffered');
const progressThumb = document.getElementById('progressThumb');
const previewTime = document.getElementById('previewTime');
const curTimeEl = document.getElementById('curTime');
const durTimeEl = document.getElementById('durTime');
const qualityBtn = document.getElementById('qualityBtn');
const qualityMenu = document.getElementById('qualityMenu');
const qLabel = document.getElementById('qLabel');
const pipBtn = document.getElementById('pipBtn');
const fsBtn = document.getElementById('fsBtn');
const fsIcon = document.getElementById('fsIcon');
const clickFlash = document.getElementById('clickFlash');
const flashIcon = document.getElementById('flashIcon');

const ICON_PLAY  = 'M8 5v14l11-7z';
const ICON_PAUSE = 'M6 5h4v14H6zM14 5h4v14h-4z';
const ICON_VOL   = 'M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.47 4.47 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z';
const ICON_MUTE  = 'M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.8 8.8 0 0 0 21 12a8.99 8.99 0 0 0-7-8.77v2.06A7 7 0 0 1 19 12zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z';
const ICON_FS    = 'M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z';
const ICON_FS_EX = 'M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z';

let hls = null;
let hideUITimer = null;

/* =========================================================
   ЗАПРОС HLS-ССЫЛКИ ЧЕРЕЗ CORS-ПРОКСИ
   ========================================================= */
async function fetchHlsUrl(videoId) {
  const api = `https://rutube.ru/api/play/options/${videoId}/?no_blocks=false&referer=https://rutube.ru/`;

  const proxies = [
    url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
    url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
    url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
    url => `https://cors.eu.org/${url}`,
  ];

  let json = null, lastError = null;

  for (let i = 0; i < proxies.length; i++) {
    try {
      bootText.textContent = `Пробуем прокси ${i + 1} из ${proxies.length}…`;
      const res = await fetch(proxies[i](api));
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      if (!text.trim().startsWith('{')) throw new Error('Ответ не JSON');
      json = JSON.parse(text);
      console.log('%c✓ API Rutube ответил через прокси ' + (i + 1), 'color:#3ddc84;font-weight:bold');
      break;
    } catch (e) {
      lastError = e;
      console.warn('✗ Прокси ' + (i + 1) + ' не сработал:', e.message);
    }
  }

  if (!json) throw new Error('Все CORS-прокси недоступны. Последняя ошибка: ' + (lastError?.message || 'unknown'));

  if (json.detail) {
    let reason = '';
    if (typeof json.detail === 'string') {
      reason = json.detail;
    } else if (typeof json.detail === 'object') {
      reason = json.detail.name || json.detail.message || JSON.stringify(json.detail);
    }
    throw new Error('Видео заблокировано: ' + reason);
  }
  if (json.acl_access && json.acl_access.allowed === false) {
    throw new Error('Доступ запрещён: ' + (json.acl_access.err_text || 'региональное ограничение'));
  }

  const m3u8 = findM3u8(json);

  if (!m3u8) {
    console.error('API вернул объект со ключами:', Object.keys(json));
    console.error('Полный ответ:', json);
    throw new Error('m3u8-ссылка не найдена в ответе API. Открой консоль (F12) → Console и скинь скриншот.');
  }

  console.log('%c🎬 Найдена m3u8-ссылка:', 'color:#4f8cff;font-weight:bold', m3u8);

  return {
    m3u8,
    title: json?.title || json?.orig_title || 'Rutube видео',
    thumbnail: json?.thumbnail_url || ''
  };
}

function findM3u8(obj, depth = 0) {
  if (depth > 6 || obj === null || typeof obj !== 'object') return null;

  if (obj.video_balancer?.m3u8) return obj.video_balancer.m3u8;
  if (obj.live_streams?.[0]?.m3u8) return obj.live_streams[0].m3u8;
  if (typeof obj.m3u8 === 'string' && obj.m3u8.includes('.m3u8')) return obj.m3u8;

  for (const k in obj) {
    const v = obj[k];
    if (typeof v === 'string' && v.includes('.m3u8')) return v;
    if (typeof v === 'object') {
      const found = findM3u8(v, depth + 1);
      if (found) return found;
    }
  }
  return null;
}

/* =========================================================
   ЗАГРУЗКА ВИДЕО
   ========================================================= */
async function loadVideo() {
  errorBox.classList.remove('show');
  boot.classList.remove('hide');
  bootTitle.textContent = 'Получение видео…';

  try {
    const { m3u8, title, thumbnail } = await fetchHlsUrl(VIDEO_ID);

    posterTitle.textContent = title;
    videoTitle.textContent = title;
    if (thumbnail) poster.style.backgroundImage = `url(${thumbnail})`;

    boot.classList.add('hide');

    if (window.Hls && Hls.isSupported()) {
      hls = new Hls({
        enableWorker: true,
        lowLatencyMode: false,
        backBufferLength: 60
      });
      hls.loadSource(m3u8);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, (evt, data) => {
        buildQualityMenu(data.levels);
      });
      hls.on(Hls.Events.LEVEL_SWITCHED, (evt, data) => {
        updateQualityLabel(data.level);
      });
      hls.on(Hls.Events.ERROR, (evt, data) => {
        if (!data.fatal) return;
        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
        else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
        else showError('Ошибка воспроизведения: ' + data.details);
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = m3u8;
    } else {
      showError('Ваш браузер не поддерживает HLS.');
    }
  } catch (e) {
    console.error(e);
    boot.classList.add('hide');
    showError(e.message);
  }
}

function showError(msg) {
  loader.classList.remove('show');
  errorTitle.textContent = 'Не удалось загрузить видео';
  errorText.textContent = msg;
  errorBox.classList.add('show');
}

retryBtn.addEventListener('click', () => {
  errorBox.classList.remove('show');
  loadVideo();
});

/* =========================================================
   КАЧЕСТВО
   ========================================================= */
function buildQualityMenu(levels) {
  qualityMenu.innerHTML = '';

  const autoOpt = document.createElement('div');
  autoOpt.className = 'opt active';
  autoOpt.dataset.level = '-1';
  autoOpt.textContent = 'Auto';
  qualityMenu.appendChild(autoOpt);

  const sorted = levels.map((lv, idx) => ({ lv, idx }))
    .sort((a, b) => (b.lv.height || 0) - (a.lv.height || 0));

  sorted.forEach(({ lv, idx }) => {
    const opt = document.createElement('div');
    opt.className = 'opt';
    opt.dataset.level = String(idx);
    opt.textContent = lv.height ? lv.height + 'p' : Math.round(lv.bitrate / 1000) + 'k';
    qualityMenu.appendChild(opt);
  });

  qualityMenu.querySelectorAll('.opt').forEach(opt => {
    opt.addEventListener('click', (e) => {
      e.stopPropagation();
      const level = parseInt(opt.dataset.level, 10);
      if (hls) hls.currentLevel = level;
      qualityMenu.querySelectorAll('.opt').forEach(o => o.classList.remove('active'));
      opt.classList.add('active');
      qualityMenu.classList.remove('show');
    });
  });

  qLabel.textContent = 'Auto';
}

function updateQualityLabel(levelIndex) {
  if (!hls || !hls.levels) return;
  if (hls.autoLevelEnabled) { qLabel.textContent = 'Auto'; return; }
  const lv = hls.levels[levelIndex];
  if (lv) qLabel.textContent = lv.height ? lv.height + 'p' : Math.round(lv.bitrate / 1000) + 'k';
}

qualityBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  qualityMenu.classList.toggle('show');
});
document.addEventListener('click', () => qualityMenu.classList.remove('show'));

/* =========================================================
   PLAY / PAUSE
   ========================================================= */
function togglePlay() {
  if (video.paused) video.play().catch(() => {});
  else video.pause();
}
playBtn.addEventListener('click', togglePlay);

posterPlay.addEventListener('click', (e) => {
  e.stopPropagation();
  poster.classList.add('hide');
  video.play().catch(() => {});
});

poster.addEventListener('click', () => {
  poster.classList.add('hide');
  video.play().catch(() => {});
});

video.addEventListener('play', () => {
  playIcon.querySelector('path').setAttribute('d', ICON_PAUSE);
  poster.classList.add('hide');
});
video.addEventListener('pause', () => {
  playIcon.querySelector('path').setAttribute('d', ICON_PLAY);
});

video.addEventListener('click', (e) => {
  if (e.target !== video) return;
  togglePlay();
  flashIcon.querySelector('path').setAttribute('d', video.paused ? ICON_PAUSE : ICON_PLAY);
  clickFlash.classList.remove('animate');
  void clickFlash.offsetWidth;
  clickFlash.classList.add('animate');
});

/* =========================================================
   ЗВУК
   ========================================================= */
function updateVolumeUI() {
  const muted = video.muted || video.volume === 0;
  volIcon.querySelector('path').setAttribute('d', muted ? ICON_MUTE : ICON_VOL);
  volumeEl.value = muted ? 0 : video.volume;
}
muteBtn.addEventListener('click', () => {
  video.muted = !video.muted;
  if (!video.muted && video.volume === 0) video.volume = 0.7;
  updateVolumeUI();
});
volumeEl.addEventListener('input', () => {
  video.volume = parseFloat(volumeEl.value);
  video.muted = video.volume === 0;
  updateVolumeUI();
});
video.addEventListener('volumechange', updateVolumeUI);

/* =========================================================
   ПРОГРЕСС
   ========================================================= */
function fmt(sec) {
  if (!isFinite(sec) || sec < 0) sec = 0;
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = Math.floor(sec % 60);
  if (h > 0) return h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  return m + ':' + String(s).padStart(2, '0');
}

function updateProgress() {
  const dur = video.duration || 0;
  const cur = video.currentTime || 0;
  const played = dur ? (cur / dur) * 100 : 0;

  progressPlayed.style.width = played + '%';
  progressThumb.style.left = played + '%';
  curTimeEl.textContent = fmt(cur);

  if (video.buffered.length) {
    const end = video.buffered.end(video.buffered.length - 1);
    progressBuffered.style.width = (dur ? (end / dur) * 100 : 0) + '%';
  }
}
video.addEventListener('timeupdate', updateProgress);
video.addEventListener('progress', updateProgress);
video.addEventListener('loadedmetadata', () => {
  durTimeEl.textContent = fmt(video.duration);
  updateProgress();
});

function seekFromEvent(e) {
  const rect = progressWrap.getBoundingClientRect();
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
  const ratio = Math.max(0, Math.min(1, x / rect.width));
  const dur = video.duration || 0;
  if (dur) {
    progressPlayed.style.width = (ratio * 100) + '%';
    progressThumb.style.left = (ratio * 100) + '%';
    curTimeEl.textContent = fmt(ratio * dur);
    return ratio * dur;
  }
  return 0;
}

progressWrap.addEventListener('mousedown', (e) => {
  seekFromEvent(e);
  const onMove = (ev) => seekFromEvent(ev);
  const onUp = (ev) => {
    const t = seekFromEvent(ev);
    if (isFinite(t)) video.currentTime = t;
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
});
progressWrap.addEventListener('mousemove', (e) => {
  const rect = progressWrap.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const ratio = Math.max(0, Math.min(1, x / rect.width));
  previewTime.style.left = (ratio * 100) + '%';
  previewTime.textContent = fmt(ratio * (video.duration || 0));
});

/* =========================================================
   FULLSCREEN
   ========================================================= */
fsBtn.addEventListener('click', () => {
  if (!document.fullscreenElement) player.requestFullscreen?.().catch(() => {});
  else document.exitFullscreen?.();
});
document.addEventListener('fullscreenchange', () => {
  const fs = !!document.fullscreenElement;
  fsIcon.querySelector('path').setAttribute('d', fs ? ICON_FS_EX : ICON_FS);
});

/* =========================================================
   PiP
   ========================================================= */
pipBtn.addEventListener('click', async () => {
  try {
    if (document.pictureInPictureElement) await document.exitPictureInPicture();
    else await video.requestPictureInPicture();
  } catch (e) {}
});

/* =========================================================
   ЗАГРУЗКА / UI
   ========================================================= */
video.addEventListener('waiting', () => loader.classList.add('show'));
video.addEventListener('playing', () => {
  loader.classList.remove('show');
  errorBox.classList.remove('show');
});
video.addEventListener('canplay', () => loader.classList.remove('show'));

function pokeUI() {
  controls.classList.add('show');
  topBar.classList.add('show');
  clearTimeout(hideUITimer);
  hideUITimer = setTimeout(() => {
    if (!video.paused) {
      controls.classList.remove('show');
      topBar.classList.remove('show');
    }
  }, 3000);
}
player.addEventListener('mousemove', pokeUI);
player.addEventListener('mouseleave', () => {
  if (!video.paused) {
    controls.classList.remove('show');
    topBar.classList.remove('show');
  }
});
player.addEventListener('click', pokeUI);
pokeUI();

/* =========================================================
   ГОРЯЧИЕ КЛАВИШИ
   ========================================================= */
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  switch (e.code) {
    case 'Space': case 'KeyK': e.preventDefault(); togglePlay(); break;
    case 'ArrowLeft': e.preventDefault(); video.currentTime = Math.max(0, video.currentTime - 5); break;
    case 'ArrowRight': e.preventDefault(); video.currentTime = Math.min(video.duration || 0, video.currentTime + 5); break;
    case 'ArrowUp': e.preventDefault(); video.volume = Math.min(1, video.volume + 0.05); break;
    case 'ArrowDown': e.preventDefault(); video.volume = Math.max(0, video.volume - 0.05); break;
    case 'KeyM': muteBtn.click(); break;
    case 'KeyF': fsBtn.click(); break;
    case 'KeyP': pipBtn.click(); break;
  }
  pokeUI();
});

/* =========================================================
   СТАРТ
   ========================================================= */
video.volume = 1;
updateVolumeUI();
loadVideo();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кастомный плеер Rutube</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --accent: #4f8cff; --accent-2: #8b5cf6; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: radial-gradient(1200px 600px at 50% 0%, #16233d 0%, #0a0d14 70%);
    color: #fff;
    display: grid; place-items: center;
    min-height: 100vh; padding: 20px;
  }

  .player {
    position: relative;
    width: 100%; max-width: 1200px;
    aspect-ratio: 16/9;
    background: #000;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.7);
    user-select: none;
  }
  video { width: 100%; height: 100%; display: block; object-fit: contain; }

  /* Постер */
  .poster {
    position: absolute; inset: 0;
    background-size: cover;
    background-position: center;
    background-color: #000;
    display: grid; place-items: center;
    z-index: 3; transition: opacity .4s;
  }
  .poster.hide { opacity: 0; pointer-events: none; }
  .poster::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,.3), rgba(0,0,0,.75));
  }
  .poster-content { position: relative; z-index: 2; text-align: center; padding: 20px; }
  .poster-play {
    width: 96px; height: 96px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: none; cursor: pointer;
    display: grid; place-items: center;
    box-shadow: 0 20px 50px rgba(79,140,255,.5);
    transition: transform .3s;
    margin: 0 auto 20px;
  }
  .poster-play:hover { transform: scale(1.08); }
  .poster-play svg { width: 40px; height: 40px; fill: #fff; margin-left: 6px; }
  .poster-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
  .poster-sub { font-size: 13px; color: #a8b3cf; }

  /* Loader */
  .loader {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    background: rgba(0,0,0,.6);
    opacity: 0; pointer-events: none;
    transition: opacity .25s; z-index: 5;
  }
  .loader.show { opacity: 1; }
  .loader-spinner {
    width: 56px; height: 56px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.15);
    border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Error */
  .error {
    position: absolute; inset: 0;
    display: none; place-items: center;
    background: rgba(6,9,15,.95);
    text-align: center; padding: 24px; z-index: 8;
  }
  .error.show { display: grid; }
  .error .icon { font-size: 52px; margin-bottom: 12px; }
  .error h3 { font-size: 18px; margin-bottom: 8px; }
  .error p { font-size: 13px; color: #a8b3cf; max-width: 420px; line-height: 1.5; }
  .error .retry {
    margin-top: 16px; padding: 9px 22px; border-radius: 9px; border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
  }

  /* Controls (без изменений — весь блок со прошлого раза) */
  .controls {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: linear-gradient(to top, rgba(0,0,0,.95), transparent 100%);
    padding: 50px 18px 14px; z-index: 7;
    opacity: 0; transform: translateY(6px);
    transition: opacity .3s, transform .3s;
  }
  .controls.show { opacity: 1; transform: translateY(0); }
  .progress-wrap {
    position: relative; height: 20px;
    display: flex; align-items: center;
    cursor: pointer; margin-bottom: 8px;
  }
  .progress-track {
    position: relative; width: 100%; height: 4px;
    background: rgba(255,255,255,.2);
    border-radius: 4px; overflow: hidden;
    transition: height .15s;
  }
  .progress-wrap:hover .progress-track { height: 7px; }
  .progress-buffered {
    position: absolute; top: 0; left: 0; bottom: 0;
    background: rgba(255,255,255,.25); width: 0%;
  }
  .progress-played {
    position: absolute; top: 0; left: 0; bottom: 0;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    width: 0%;
  }
  .progress-thumb {
    position: absolute; top: 50%; left: 0;
    width: 14px; height: 14px; border-radius: 50%;
    background: #fff;
    transform: translate(-50%,-50%) scale(0);
    transition: transform .15s; pointer-events: none;
  }
  .progress-wrap:hover .progress-thumb { transform: translate(-50%,-50%) scale(1); }

  .row { display: flex; align-items: center; gap: 10px; }
  .btn {
    width: 40px; height: 40px; border: none; background: transparent;
    color: #fff; cursor: pointer; border-radius: 9px;
    display: grid; place-items: center;
  }
  .btn:hover { background: rgba(255,255,255,.12); }
  .btn svg { width: 22px; height: 22px; fill: currentColor; }
  .time { font-size: 13px; font-variant-numeric: tabular-nums; padding: 0 6px; }
  .spacer { flex: 1; }

  .volume-slider {
    -webkit-appearance: none; width: 0; height: 4px;
    background: rgba(255,255,255,.25); border-radius: 4px;
    transition: width .25s; cursor: pointer;
  }
  .volume-wrap:hover .volume-slider { width: 80px; }
  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none; width: 13px; height: 13px;
    border-radius: 50%; background: #fff;
  }

  .quality { position: relative; }
  .quality-btn { width: auto; padding: 0 12px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .quality-menu {
    position: absolute; bottom: 100%; right: 0; margin-bottom: 8px;
    min-width: 90px; background: rgba(15,20,30,.96);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 10px; padding: 6px;
    opacity: 0; transform: translateY(6px); pointer-events: none;
    transition: .2s;
  }
  .quality-menu.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .quality-menu .opt {
    padding: 8px 12px; font-size: 13px; font-weight: 600;
    cursor: pointer; border-radius: 6px;
  }
  .quality-menu .opt:hover { background: rgba(255,255,255,.08); }
  .quality-menu .opt.active { color: var(--accent); }

  /* Boot */
  .boot {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    background: rgba(0,0,0,.85); z-index: 12;
    transition: opacity .3s;
  }
  .boot.hide { opacity: 0; pointer-events: none; }
  .boot-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; text-align: center; }
  .boot-text { font-size: 13px; color: #a8b3cf; max-width: 420px; line-height: 1.5; text-align: center; }
</style>
</head>
<body>

<div class="player" id="player">
  <video id="video" playsinline webkit-playsinline></video>

  <div class="poster" id="poster">
    <div class="poster-content">
      <button class="poster-play" id="posterPlay">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <div class="poster-title" id="posterTitle">Загрузка…</div>
      <div class="poster-sub">Rutube · без рекламы</div>
    </div>
  </div>

  <div class="boot" id="boot">
    <div>
      <div class="boot-title" id="bootTitle">Получение видео…</div>
      <div class="boot-text" id="bootText">Обращаемся к API Rutube</div>
    </div>
  </div>

  <div class="loader" id="loader"><div class="loader-spinner"></div></div>

  <div class="error" id="error">
    <div>
      <div class="icon">📡</div>
      <h3 id="errorTitle">Не удалось загрузить</h3>
      <p id="errorText"></p>
      <button class="retry" id="retryBtn">Повторить</button>
    </div>
  </div>

  <div class="controls" id="controls">
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-track">
        <div class="progress-buffered" id="progressBuffered"></div>
        <div class="progress-played" id="progressPlayed"></div>
      </div>
      <div class="progress-thumb" id="progressThumb"></div>
    </div>
    <div class="row">
      <button class="btn" id="playBtn">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <div class="volume-wrap" style="display:flex;align-items:center;gap:4px">
        <button class="btn" id="muteBtn">
          <svg id="volIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.47 4.47 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/></svg>
        </button>
        <input type="range" class="volume-slider" id="volume" min="0" max="1" step="0.01" value="1">
      </div>
      <div class="time">
        <span id="curTime">0:00</span>
        <span style="color:rgba(255,255,255,.4);margin:0 4px">/</span>
        <span id="durTime">0:00</span>
      </div>
      <div class="spacer"></div>
      <div class="quality">
        <button class="btn quality-btn" id="qualityBtn">
          <span id="qLabel">Auto</span>
        </button>
        <div class="quality-menu" id="qualityMenu"></div>
      </div>
      <button class="btn" id="fsBtn">
        <svg id="fsIcon" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
/* ============ ID видео ============ */
// ВАЖНО: это видео заблокировано в РФ. Замени на любое другое с rutube.ru
const VIDEO_ID = 'cae96c24f81419ccd444ed151a169985';

/* ============ Элементы ============ */
const video = document.getElementById('video');
const player = document.getElementById('player');
const controls = document.getElementById('controls');
const loader = document.getElementById('loader');
const errorBox = document.getElementById('error');
const errorTitle = document.getElementById('errorTitle');
const errorText = document.getElementById('errorText');
const retryBtn = document.getElementById('retryBtn');
const boot = document.getElementById('boot');
const bootTitle = document.getElementById('bootTitle');
const bootText = document.getElementById('bootText');
const poster = document.getElementById('poster');
const posterPlay = document.getElementById('posterPlay');
const posterTitle = document.getElementById('posterTitle');

const playBtn = document.getElementById('playBtn');
const playIcon = document.getElementById('playIcon');
const muteBtn = document.getElementById('muteBtn');
const volIcon = document.getElementById('volIcon');
const volumeEl = document.getElementById('volume');
const progressWrap = document.getElementById('progressWrap');
const progressPlayed = document.getElementById('progressPlayed');
const progressBuffered = document.getElementById('progressBuffered');
const progressThumb = document.getElementById('progressThumb');
const curTimeEl = document.getElementById('curTime');
const durTimeEl = document.getElementById('durTime');
const qualityBtn = document.getElementById('qualityBtn');
const qualityMenu = document.getElementById('qualityMenu');
const qLabel = document.getElementById('qLabel');
const fsBtn = document.getElementById('fsBtn');
const fsIcon = document.getElementById('fsIcon');

const ICON_PLAY  = 'M8 5v14l11-7z';
const ICON_PAUSE = 'M6 5h4v14H6zM14 5h4v14h-4z';
const ICON_VOL   = 'M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.47 4.47 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z';
const ICON_MUTE  = 'M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.8 8.8 0 0 0 21 12a8.99 8.99 0 0 0-7-8.77v2.06A7 7 0 0 1 19 12zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z';
const ICON_FS    = 'M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z';
const ICON_FS_EX = 'M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z';

let hls = null;
let hideTimer = null;

/* ============ Прокси-фетч API Rutube ============ */
async function fetchHlsUrl(videoId) {
  const api = `https://rutube.ru/api/play/options/${videoId}/?no_blocks=false&referer=https://rutube.ru/`;

  const proxies = [
    url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
    url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
    url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
    url => `https://cors.eu.org/${url}`,
  ];

  let json = null, lastError = null;

  for (const proxify of proxies) {
    try {
      const res = await fetch(proxify(api));
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      if (!text.trim().startsWith('{')) throw new Error('Не JSON');
      json = JSON.parse(text);
      console.log('✓ Сработал прокси:', proxify(api).slice(0, 60) + '…');
      break;
    } catch (e) {
      lastError = e;
      console.warn('✗', e.message);
    }
  }

  if (!json) throw new Error('Все CORS-прокси недоступны. ' + (lastError?.message || ''));

  if (json.detail && /block|geo|запрещ|недоступ|удал/i.test(json.detail)) {
    throw new Error('Видео заблокировано: ' + json.detail);
  }

  const m3u8 = json?.video_balancer?.m3u8 || json?.live_streams?.[0]?.m3u8;
  if (!m3u8) throw new Error('Прямая ссылка не найдена — возможно, видео приватное или удалено.');

  return {
    m3u8,
    title: json?.title || json?.orig_title || 'Rutube видео',
    thumbnail: json?.thumbnail_url || ''
  };
}

/* ============ Загрузка ============ */
async function loadVideo() {
  errorBox.classList.remove('show');
  boot.classList.remove('hide');
  bootTitle.textContent = 'Получение видео…';

  try {
    const { m3u8, title, thumbnail } = await fetchHlsUrl(VIDEO_ID);
    posterTitle.textContent = title;
    if (thumbnail) poster.style.backgroundImage = `url(${thumbnail})`;

    boot.classList.add('hide');

    if (window.Hls && Hls.isSupported()) {
      hls = new Hls({ enableWorker: true, backBufferLength: 60 });
      hls.loadSource(m3u8);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, (e, data) => buildQualityMenu(data.levels));
      hls.on(Hls.Events.LEVEL_SWITCHED, (e, data) => updateQualityLabel(data.level));
      hls.on(Hls.Events.ERROR, (e, data) => {
        if (!data.fatal) return;
        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
        else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
        else showError('Ошибка: ' + data.details);
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = m3u8;
    } else {
      showError('Браузер не поддерживает HLS.');
    }
  } catch (e) {
    console.error(e);
    boot.classList.add('hide');
    showError(e.message);
  }
}

function showError(msg) {
  loader.classList.remove('show');
  errorTitle.textContent = 'Не удалось загрузить видео';
  errorText.textContent = msg;
  errorBox.classList.add('show');
}
retryBtn.addEventListener('click', () => { errorBox.classList.remove('show'); loadVideo(); });

/* ============ Качество ============ */
function buildQualityMenu(levels) {
  qualityMenu.innerHTML = '';
  const auto = document.createElement('div');
  auto.className = 'opt active';
  auto.dataset.level = '-1';
  auto.textContent = 'Auto';
  qualityMenu.appendChild(auto);

  levels.map((lv, i) => ({ lv, i }))
    .sort((a, b) => (b.lv.height || 0) - (a.lv.height || 0))
    .forEach(({ lv, i }) => {
      const o = document.createElement('div');
      o.className = 'opt';
      o.dataset.level = String(i);
      o.textContent = lv.height ? lv.height + 'p' : Math.round(lv.bitrate/1000) + 'k';
      qualityMenu.appendChild(o);
    });

  qualityMenu.querySelectorAll('.opt').forEach(o => {
    o.addEventListener('click', e => {
      e.stopPropagation();
      if (hls) hls.currentLevel = parseInt(o.dataset.level, 10);
      qualityMenu.querySelectorAll('.opt').forEach(x => x.classList.remove('active'));
      o.classList.add('active');
      qualityMenu.classList.remove('show');
    });
  });
}
function updateQualityLabel(i) {
  if (!hls || !hls.levels) return;
  if (hls.autoLevelEnabled) { qLabel.textContent = 'Auto'; return; }
  const lv = hls.levels[i];
  if (lv) qLabel.textContent = lv.height ? lv.height + 'p' : Math.round(lv.bitrate/1000) + 'k';
}
qualityBtn.addEventListener('click', e => { e.stopPropagation(); qualityMenu.classList.toggle('show'); });
document.addEventListener('click', () => qualityMenu.classList.remove('show'));

/* ============ Play / Pause ============ */
function togglePlay() { video.paused ? video.play().catch(()=>{}) : video.pause(); }
playBtn.addEventListener('click', togglePlay);
posterPlay.addEventListener('click', e => { e.stopPropagation(); poster.classList.add('hide'); video.play().catch(()=>{}); });
poster.addEventListener('click', () => { poster.classList.add('hide'); video.play().catch(()=>{}); });
video.addEventListener('play', () => { playIcon.querySelector('path').setAttribute('d', ICON_PAUSE); poster.classList.add('hide'); });
video.addEventListener('pause', () => playIcon.querySelector('path').setAttribute('d', ICON_PLAY));

/* ============ Звук ============ */
function updateVolUI() {
  const m = video.muted || video.volume === 0;
  volIcon.querySelector('path').setAttribute('d', m ? ICON_MUTE : ICON_VOL);
  volumeEl.value = m ? 0 : video.volume;
}
muteBtn.addEventListener('click', () => { video.muted = !video.muted; if (!video.muted && video.volume === 0) video.volume = 0.7; updateVolUI(); });
volumeEl.addEventListener('input', () => { video.volume = parseFloat(volumeEl.value); video.muted = video.volume === 0; updateVolUI(); });
video.addEventListener('volumechange', updateVolUI);

/* ============ Прогресс ============ */
function fmt(s) {
  if (!isFinite(s) || s < 0) s = 0;
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = Math.floor(s%60);
  return h > 0 ? `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}` : `${m}:${String(sec).padStart(2,'0')}`;
}
video.addEventListener('timeupdate', () => {
  const d = video.duration || 0, c = video.currentTime || 0;
  const p = d ? (c/d)*100 : 0;
  progressPlayed.style.width = p + '%';
  progressThumb.style.left = p + '%';
  curTimeEl.textContent = fmt(c);
  if (video.buffered.length) {
    const e = video.buffered.end(video.buffered.length - 1);
    progressBuffered.style.width = (d ? (e/d)*100 : 0) + '%';
  }
});
video.addEventListener('loadedmetadata', () => { durTimeEl.textContent = fmt(video.duration); });

function seek(e) {
  const r = progressWrap.getBoundingClientRect();
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
  const ratio = Math.max(0, Math.min(1, x / r.width));
  if (video.duration) video.currentTime = ratio * video.duration;
}
progressWrap.addEventListener('mousedown', e => {
  seek(e);
  const move = ev => seek(ev);
  const up = () => { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); };
  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', up);
});

/* ============ FS ============ */
fsBtn.addEventListener('click', () => {
  if (!document.fullscreenElement) player.requestFullscreen?.().catch(()=>{});
  else document.exitFullscreen?.();
});
document.addEventListener('fullscreenchange', () => {
  const fs = !!document.fullscreenElement;
  fsIcon.querySelector('path').setAttribute('d', fs ? ICON_FS_EX : ICON_FS);
});

/* ============ UI autohide ============ */
function pokeUI() {
  controls.classList.add('show');
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => { if (!video.paused) controls.classList.remove('show'); }, 3000);
}
player.addEventListener('mousemove', pokeUI);
player.addEventListener('mouseleave', () => { if (!video.paused) controls.classList.remove('show'); });
pokeUI();

/* ============ Клавиши ============ */
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  switch (e.code) {
    case 'Space': case 'KeyK': e.preventDefault(); togglePlay(); break;
    case 'ArrowLeft': e.preventDefault(); video.currentTime = Math.max(0, video.currentTime - 5); break;
    case 'ArrowRight': e.preventDefault(); video.currentTime = Math.min(video.duration||0, video.currentTime + 5); break;
    case 'ArrowUp': e.preventDefault(); video.volume = Math.min(1, video.volume + .05); break;
    case 'ArrowDown': e.preventDefault(); video.volume = Math.max(0, video.volume - .05); break;
    case 'KeyM': muteBtn.click(); break;
    case 'KeyF': fsBtn.click(); break;
  }
  pokeUI();
});

/* ============ Старт ============ */
video.volume = 1;
updateVolUI();
loadVideo();
</script>
</body>
</html>

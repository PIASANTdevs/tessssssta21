<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кастомный плеер Rutube</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --accent: #4f8cff;
    --accent-2: #8b5cf6;
    --bg: #0a0d14;
    --text: #fff;
    --muted: #a8b3cf;
  }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: radial-gradient(1200px 600px at 50% 0%, #16233d 0%, var(--bg) 70%);
    color: var(--text);
    display: grid; place-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .player {
    position: relative;
    width: 100%; max-width: 1200px;
    aspect-ratio: 16/9;
    background: #000;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.06);
    user-select: none;
  }

  video {
    width: 100%; height: 100%; display: block;
    background: #000; object-fit: contain;
  }

  /* Большая кнопка Play */
  .center-play {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%,-50%) scale(.9);
    width: 84px; height: 84px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: none; cursor: pointer;
    display: grid; place-items: center;
    box-shadow: 0 20px 50px rgba(79,140,255,.5);
    opacity: 0; pointer-events: none;
    transition: opacity .3s, transform .3s;
    z-index: 6;
  }
  .center-play.show { opacity: 1; pointer-events: auto; transform: translate(-50%,-50%) scale(1); }
  .center-play:hover { transform: translate(-50%,-50%) scale(1.08); }
  .center-play svg { width: 36px; height: 36px; fill: #fff; margin-left: 4px; }

  /* Загрузчик */
  .loader {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    background: rgba(0,0,0,.6);
    pointer-events: none; opacity: 0;
    transition: opacity .25s; z-index: 5;
  }
  .loader.show { opacity: 1; }
  .loader-spinner {
    width: 56px; height: 56px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.15);
    border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Ошибка */
  .error {
    position: absolute; inset: 0;
    display: none; place-items: center;
    background: rgba(6,9,15,.95);
    text-align: center; padding: 24px; z-index: 8;
  }
  .error.show { display: grid; }
  .error .icon { font-size: 52px; margin-bottom: 12px; }
  .error h3 { font-size: 18px; margin-bottom: 8px; }
  .error p { font-size: 13px; color: var(--muted); max-width: 420px; line-height: 1.5; }

  /* Flash иконка */
  .click-flash {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    width: 80px; height: 80px; border-radius: 50%;
    background: rgba(0,0,0,.55);
    display: grid; place-items: center;
    opacity: 0; pointer-events: none; z-index: 5;
  }
  .click-flash svg { width: 40px; height: 40px; fill: #fff; }
  .click-flash.animate { animation: flashPulse .6s ease forwards; }
  @keyframes flashPulse {
    0% { opacity: 0; transform: translate(-50%,-50%) scale(.6); }
    20% { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%,-50%) scale(1.3); }
  }

  /* Верхняя панель */
  .top-bar {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 16px 18px;
    background: linear-gradient(to bottom, rgba(0,0,0,.75), transparent);
    display: flex; align-items: center; gap: 12px;
    z-index: 6; pointer-events: none;
    opacity: 0; transition: opacity .3s;
  }
  .top-bar.show { opacity: 1; }
  .top-bar .title {
    font-size: 14px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-shadow: 0 1px 3px rgba(0,0,0,.6);
  }

  /* Контролы */
  .controls {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: linear-gradient(to top, rgba(0,0,0,.95) 0%, rgba(0,0,0,.7) 60%, transparent 100%);
    padding: 50px 18px 14px;
    z-index: 7;
    opacity: 0; transform: translateY(6px);
    transition: opacity .3s, transform .3s;
  }
  .controls.show { opacity: 1; transform: translateY(0); }

  .progress-wrap {
    position: relative;
    height: 20px;
    display: flex; align-items: center;
    cursor: pointer;
    margin-bottom: 8px;
  }
  .progress-track {
    position: relative;
    width: 100%; height: 4px;
    background: rgba(255,255,255,.2);
    border-radius: 4px; overflow: hidden;
    transition: height .15s;
  }
  .progress-wrap:hover .progress-track { height: 7px; }
  .progress-buffered {
    position: absolute; top: 0; left: 0; bottom: 0;
    background: rgba(255,255,255,.25);
    width: 0%;
  }
  .progress-played {
    position: absolute; top: 0; left: 0; bottom: 0;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    width: 0%;
  }
  .progress-thumb {
    position: absolute; top: 50%; left: 0;
    width: 14px; height: 14px; border-radius: 50%;
    background: #fff;
    transform: translate(-50%,-50%) scale(0);
    box-shadow: 0 2px 8px rgba(0,0,0,.6);
    transition: transform .15s;
    pointer-events: none;
  }
  .progress-wrap:hover .progress-thumb { transform: translate(-50%,-50%) scale(1); }
  .preview-time {
    position: absolute; bottom: 26px;
    transform: translateX(-50%);
    padding: 4px 10px;
    background: rgba(0,0,0,.85);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 6px;
    font-size: 12px; font-weight: 600;
    color: #fff; opacity: 0;
    transition: opacity .15s;
    pointer-events: none; white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .progress-wrap:hover .preview-time { opacity: 1; }

  .row { display: flex; align-items: center; gap: 10px; }

  .btn {
    width: 40px; height: 40px;
    border: none; background: transparent; color: #fff;
    cursor: pointer; border-radius: 9px;
    display: grid; place-items: center;
    transition: background .15s, transform .1s;
  }
  .btn:hover { background: rgba(255,255,255,.12); }
  .btn:active { transform: scale(.92); }
  .btn svg { width: 22px; height: 22px; fill: currentColor; pointer-events: none; }

  .time {
    font-size: 13px; color: #fff;
    font-variant-numeric: tabular-nums;
    padding: 0 6px;
  }
  .time .sep { color: rgba(255,255,255,.4); margin: 0 4px; }

  .volume-wrap { display: flex; align-items: center; gap: 4px; }
  .volume-slider {
    -webkit-appearance: none; appearance: none;
    width: 0; height: 4px;
    background: rgba(255,255,255,.25);
    border-radius: 4px; outline: none;
    transition: width .25s; cursor: pointer;
  }
  .volume-wrap:hover .volume-slider,
  .volume-slider:focus { width: 80px; }
  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 13px; height: 13px; border-radius: 50%;
    background: #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,.5);
  }

  .spacer { flex: 1; }

  /* Качество */
  .quality { position: relative; }
  .quality-btn {
    width: auto; padding: 0 12px; height: 40px;
    font-size: 13px; font-weight: 600;
    display: flex; align-items: center; gap: 6px;
  }
  .quality-menu {
    position: absolute; bottom: 100%; right: 0;
    margin-bottom: 8px; min-width: 90px;
    background: rgba(15,20,30,.96);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 10px; padding: 6px;
    opacity: 0; transform: translateY(6px) scale(.96);
    pointer-events: none; transition: .2s;
    box-shadow: 0 20px 40px rgba(0,0,0,.5);
  }
  .quality-menu.show { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
  .quality-menu .opt {
    padding: 8px 12px; font-size: 13px; font-weight: 600;
    color: #fff; cursor: pointer; border-radius: 6px;
    white-space: nowrap;
  }
  .quality-menu .opt:hover { background: rgba(255,255,255,.08); }
  .quality-menu .opt.active { color: var(--accent); }

  /* Статус загрузки ссылки */
  .boot {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    background: rgba(0,0,0,.85); z-index: 10;
    text-align: center; padding: 24px;
  }
  .boot.hide { display: none; }
  .boot-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
  .boot-text { font-size: 13px; color: var(--muted); max-width: 400px; line-height: 1.5; }
</style>
</head>
<body>

<div class="player" id="player">
  <video id="video" playsinline webkit-playsinline></video>

  <!-- Статус загрузки -->
  <div class="boot" id="boot">
    <div>
      <div class="boot-title" id="bootTitle">Получение видео…</div>
      <div class="boot-text" id="bootText">Обращаемся к API Rutube</div>
    </div>
  </div>

  <!-- Верхняя панель -->
  <div class="top-bar" id="topBar">
    <div class="title" id="videoTitle">Загрузка…</div>
  </div>

  <!-- Большая Play -->
  <button class="center-play" id="centerPlay">
    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
  </button>

  <!-- Flash иконка -->
  <div class="click-flash" id="clickFlash">
    <svg id="flashIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
  </div>

  <!-- Загрузчик -->
  <div class="loader show" id="loader">
    <div class="loader-spinner"></div>
  </div>

  <!-- Ошибка -->
  <div class="error" id="error">
    <div>
      <div class="icon">📡</div>
      <h3 id="errorTitle">Не удалось загрузить видео</h3>
      <p id="errorText"></p>
    </div>
  </div>

  <!-- Контролы -->
  <div class="controls" id="controls">
    <div class="progress-wrap" id="progressWrap">
      <div class="preview-time" id="previewTime">0:00</div>
      <div class="progress-track">
        <div class="progress-buffered" id="progressBuffered"></div>
        <div class="progress-played" id="progressPlayed"></div>
      </div>
      <div class="progress-thumb" id="progressThumb"></div>
    </div>

    <div class="row">
      <button class="btn" id="playBtn">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>

      <div class="volume-wrap">
        <button class="btn" id="muteBtn">
          <svg id="volIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.47 4.47 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/></svg>
        </button>
        <input type="range" class="volume-slider" id="volume" min="0" max="1" step="0.01" value="1">
      </div>

      <div class="time">
        <span id="curTime">0:00</span>
        <span class="sep">/</span>
        <span id="durTime">0:00</span>
      </div>

      <div class="spacer"></div>

      <div class="quality">
        <button class="btn quality-btn" id="qualityBtn">
          <svg viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-1 11h-3v3h-2v-3H8v-2h5V9h2v3h3v2z"/></svg>
          <span id="qLabel">Auto</span>
        </button>
        <div class="quality-menu" id="qualityMenu"></div>
      </div>

      <button class="btn" id="pipBtn">
        <svg viewBox="0 0 24 24"><path d="M19 11h-8v6h8v-6zm4 8V5a2 2 0 0 0-2-2H3a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2zm-2 .02H3V4.98h18v14.04z"/></svg>
      </button>

      <button class="btn" id="fsBtn">
        <svg id="fsIcon" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   НАСТРОЙКИ
   ========================================================= */
// ID видео из ссылки rutube.ru/play/embed/XXXX
const VIDEO_ID = 'cae96c24f81419ccd444ed151a169985';

/* =========================================================
   ЭЛЕМЕНТЫ
   ========================================================= */
const video = document.getElementById('video');
const player = document.getElementById('player');
const controls = document.getElementById('controls');
const topBar = document.getElementById('topBar');
const loader = document.getElementById('loader');
const errorBox = document.getElementById('error');
const errorTitle = document.getElementById('errorTitle');
const errorText = document.getElementById('errorText');
const boot = document.getElementById('boot');
const bootTitle = document.getElementById('bootTitle');
const bootText = document.getElementById('bootText');

const playBtn = document.getElementById('playBtn');
const playIcon = document.getElementById('playIcon');
const centerPlay = document.getElementById('centerPlay');
const muteBtn = document.getElementById('muteBtn');
const volIcon = document.getElementById('volIcon');
const volumeEl = document.getElementById('volume');

const progressWrap = document.getElementById('progressWrap');
const progressPlayed = document.getElementById('progressPlayed');
const progressBuffered = document.getElementById('progressBuffered');
const progressThumb = document.getElementById('progressThumb');
const previewTime = document.getElementById('previewTime');

const curTimeEl = document.getElementById('curTime');
const durTimeEl = document.getElementById('durTime');

const qualityBtn = document.getElementById('qualityBtn');
const qualityMenu = document.getElementById('qualityMenu');
const qLabel = document.getElementById('qLabel');

const pipBtn = document.getElementById('pipBtn');
const fsBtn = document.getElementById('fsBtn');
const fsIcon = document.getElementById('fsIcon');
const clickFlash = document.getElementById('clickFlash');
const flashIcon = document.getElementById('flashIcon');

const ICON_PLAY  = 'M8 5v14l11-7z';
const ICON_PAUSE = 'M6 5h4v14H6zM14 5h4v14h-4z';
const ICON_VOL   = 'M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.47 4.47 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z';
const ICON_MUTE  = 'M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.8 8.8 0 0 0 21 12a8.99 8.99 0 0 0-7-8.77v2.06A7 7 0 0 1 19 12zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z';
const ICON_FS    = 'M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z';
const ICON_FS_EX = 'M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z';

let hls = null;
let hideUITimer = null;
let isSeeking = false;

/* =========================================================
   ПОЛУЧЕНИЕ HLS ССЫЛКИ ИЗ API RUTUBE
   ========================================================= */
async function fetchHlsUrl(videoId) {
  // Rutube API: этот эндпоинт отдаёт JSON с video_balancer.m3u8
  const api = `https://rutube.ru/api/play/options/${videoId}/?no_blocks=false&referer=https://rutube.ru/`;
  const res = await fetch(api);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const json = await res.json();

  // Проверяем блокировки
  if (json.detail && /block|geo|запрещ/i.test(json.detail)) {
    throw new Error('Видео заблокировано: ' + json.detail);
  }

  // Достаём ссылку
  const m3u8 = json?.video_balancer?.m3u8 || json?.live_streams?.[0]?.m3u8;
  if (!m3u8) throw new Error('Прямая ссылка не найдена — возможно, видео заблокировано или удалено');

  // Метаданные
  const title = json?.title || json?.orig_title || 'Rutube видео';
  return { m3u8, title };
}

/* =========================================================
   ЗАГРУЗКА
   ========================================================= */
async function loadVideo() {
  try {
    bootTitle.textContent = 'Получение видео…';
    bootText.textContent = 'Обращаемся к API Rutube';

    const { m3u8, title } = await fetchHlsUrl(VIDEO_ID);
    document.getElementById('videoTitle').textContent = title;

    boot.classList.add('hide');

    if (window.Hls && Hls.isSupported()) {
      hls = new Hls({
        enableWorker: true,
        lowLatencyMode: false,
        backBufferLength: 60
      });
      hls.loadSource(m3u8);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, (evt, data) => {
        buildQualityMenu(data.levels);
        video.play().catch(() => {});
      });
      hls.on(Hls.Events.LEVEL_SWITCHED, (evt, data) => {
        updateQualityLabel(data.level);
      });
      hls.on(Hls.Events.ERROR, (evt, data) => {
        if (!data.fatal) return;
        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
        else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
        else showError('Ошибка воспроизведения: ' + data.details);
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = m3u8;
      video.play().catch(() => {});
    } else {
      showError('Ваш браузер не поддерживает HLS.');
    }
  } catch (e) {
    // Показываем ошибку до того как спрятать boot
    bootTitle.textContent = 'Видео недоступно';
    bootText.textContent = e.message;
    boot.querySelector('.boot-title').style.color = '#ff5566';
    setTimeout(() => boot.classList.add('hide'), 3000);
    showError(e.message);
  }
}

function showError(msg) {
  loader.classList.remove('show');
  errorText.textContent = msg;
  errorBox.classList.add('show');
}

/* =========================================================
   СЕЛЕКТОР КАЧЕСТВА
   ========================================================= */
function buildQualityMenu(levels) {
  qualityMenu.innerHTML = '';

  const autoOpt = document.createElement('div');
  autoOpt.className = 'opt active';
  autoOpt.dataset.level = '-1';
  autoOpt.textContent = 'Auto';
  qualityMenu.appendChild(autoOpt);

  const sorted = levels.map((lv, idx) => ({ lv, idx }))
    .sort((a, b) => (b.lv.height || 0) - (a.lv.height || 0));

  sorted.forEach(({ lv, idx }) => {
    const opt = document.createElement('div');
    opt.className = 'opt';
    opt.dataset.level = String(idx);
    const label = lv.height ? lv.height + 'p' : (Math.round(lv.bitrate / 1000) + 'k');
    opt.textContent = label;
    qualityMenu.appendChild(opt);
  });

  qualityMenu.querySelectorAll('.opt').forEach(opt => {
    opt.addEventListener('click', (e) => {
      e.stopPropagation();
      const level = parseInt(opt.dataset.level, 10);
      if (hls) hls.currentLevel = level;
      qualityMenu.querySelectorAll('.opt').forEach(o => o.classList.remove('active'));
      opt.classList.add('active');
      qualityMenu.classList.remove('show');
    });
  });

  qLabel.textContent = 'Auto';
}

function updateQualityLabel(levelIndex) {
  if (!hls || !hls.levels) return;
  if (hls.autoLevelEnabled) { qLabel.textContent = 'Auto'; return; }
  const lv = hls.levels[levelIndex];
  if (lv) qLabel.textContent = lv.height ? lv.height + 'p' : (Math.round(lv.bitrate / 1000) + 'k');
}

qualityBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  qualityMenu.classList.toggle('show');
});
document.addEventListener('click', () => qualityMenu.classList.remove('show'));

/* =========================================================
   УПРАВЛЕНИЕ
   ========================================================= */
function togglePlay() {
  if (video.paused) video.play().catch(() => {});
  else video.pause();
}
playBtn.addEventListener('click', togglePlay);
centerPlay.addEventListener('click', togglePlay);

video.addEventListener('play', () => {
  playIcon.querySelector('path').setAttribute('d', ICON_PAUSE);
  centerPlay.classList.remove('show');
});
video.addEventListener('pause', () => {
  playIcon.querySelector('path').setAttribute('d', ICON_PLAY);
  centerPlay.classList.add('show');
});

video.addEventListener('click', (e) => {
  if (e.target !== video) return;
  togglePlay();
  flashIcon.querySelector('path').setAttribute('d', video.paused ? ICON_PAUSE : ICON_PLAY);
  clickFlash.classList.remove('animate');
  void clickFlash.offsetWidth;
  clickFlash.classList.add('animate');
});

/* =========================================================
   ЗВУК
   ========================================================= */
function updateVolumeUI() {
  const muted = video.muted || video.volume === 0;
  volIcon.querySelector('path').setAttribute('d', muted ? ICON_MUTE : ICON_VOL);
  volumeEl.value = muted ? 0 : video.volume;
}
muteBtn.addEventListener('click', () => {
  video.muted = !video.muted;
  if (!video.muted && video.volume === 0) video.volume = 0.7;
  updateVolumeUI();
});
volumeEl.addEventListener('input', () => {
  video.volume = parseFloat(volumeEl.value);
  video.muted = video.volume === 0;
  updateVolumeUI();
});
video.addEventListener('volumechange', updateVolumeUI);

/* =========================================================
   ПРОГРЕСС
   ========================================================= */
function fmt(sec) {
  if (!isFinite(sec) || sec < 0) sec = 0;
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = Math.floor(sec % 60);
  if (h > 0) return h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  return m + ':' + String(s).padStart(2, '0');
}

function updateProgress() {
  if (isSeeking) return;
  const dur = video.duration || 0;
  const cur = video.currentTime || 0;
  const played = dur ? (cur / dur) * 100 : 0;

  progressPlayed.style.width = played + '%';
  progressThumb.style.left = played + '%';
  curTimeEl.textContent = fmt(cur);

  if (video.buffered.length) {
    const end = video.buffered.end(video.buffered.length - 1);
    progressBuffered.style.width = (dur ? (end / dur) * 100 : 0) + '%';
  }
}
video.addEventListener('timeupdate', updateProgress);
video.addEventListener('progress', updateProgress);
video.addEventListener('loadedmetadata', () => {
  durTimeEl.textContent = fmt(video.duration);
  updateProgress();
});

function seekFromEvent(e) {
  const rect = progressWrap.getBoundingClientRect();
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
  const ratio = Math.max(0, Math.min(1, x / rect.width));
  const dur = video.duration || 0;
  if (dur) {
    progressPlayed.style.width = (ratio * 100) + '%';
    progressThumb.style.left = (ratio * 100) + '%';
    curTimeEl.textContent = fmt(ratio * dur);
    return ratio * dur;
  }
  return 0;
}

progressWrap.addEventListener('mousedown', (e) => {
  isSeeking = true;
  seekFromEvent(e);
  const onMove = (ev) => seekFromEvent(ev);
  const onUp = (ev) => {
    isSeeking = false;
    const t = seekFromEvent(ev);
    if (isFinite(t)) video.currentTime = t;
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
});
progressWrap.addEventListener('mousemove', (e) => {
  const rect = progressWrap.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const ratio = Math.max(0, Math.min(1, x / rect.width));
  previewTime.style.left = (ratio * 100) + '%';
  previewTime.textContent = fmt(ratio * (video.duration || 0));
});

/* =========================================================
   FULLSCREEN
   ========================================================= */
fsBtn.addEventListener('click', () => {
  if (!document.fullscreenElement) player.requestFullscreen?.().catch(() => {});
  else document.exitFullscreen?.();
});
document.addEventListener('fullscreenchange', () => {
  const fs = !!document.fullscreenElement;
  fsIcon.querySelector('path').setAttribute('d', fs ? ICON_FS_EX : ICON_FS);
});

/* =========================================================
   PiP
   ========================================================= */
pipBtn.addEventListener('click', async () => {
  try {
    if (document.pictureInPictureElement) await document.exitPictureInPicture();
    else await video.requestPictureInPicture();
  } catch (e) {}
});

/* =========================================================
   ЗАГРУЗКА / UI
   ========================================================= */
video.addEventListener('waiting', () => loader.classList.add('show'));
video.addEventListener('playing', () => {
  loader.classList.remove('show');
  errorBox.classList.remove('show');
});
video.addEventListener('canplay', () => loader.classList.remove('show'));

function pokeUI() {
  controls.classList.add('show');
  topBar.classList.add('show');
  clearTimeout(hideUITimer);
  hideUITimer = setTimeout(() => {
    if (!video.paused) {
      controls.classList.remove('show');
      topBar.classList.remove('show');
    }
  }, 3000);
}
player.addEventListener('mousemove', pokeUI);
player.addEventListener('mouseleave', () => {
  if (!video.paused) {
    controls.classList.remove('show');
    topBar.classList.remove('show');
  }
});
player.addEventListener('click', pokeUI);
pokeUI();

/* =========================================================
   ГОРЯЧИЕ КЛАВИШИ
   ========================================================= */
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  switch (e.code) {
    case 'Space': case 'KeyK': e.preventDefault(); togglePlay(); break;
    case 'ArrowLeft': e.preventDefault(); video.currentTime = Math.max(0, video.currentTime - 5); break;
    case 'ArrowRight': e.preventDefault(); video.currentTime = Math.min(video.duration || 0, video.currentTime + 5); break;
    case 'ArrowUp': e.preventDefault(); video.volume = Math.min(1, video.volume + 0.05); break;
    case 'ArrowDown': e.preventDefault(); video.volume = Math.max(0, video.volume - 0.05); break;
    case 'KeyM': muteBtn.click(); break;
    case 'KeyF': fsBtn.click(); break;
    case 'KeyP': pipBtn.click(); break;
  }
  pokeUI();
});

/* =========================================================
   СТАРТ
   ========================================================= */
video.volume = 1;
updateVolumeUI();
loadVideo();
</script>
</body>
</html>

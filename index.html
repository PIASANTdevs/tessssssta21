<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кастомный плеер Rutube</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --accent: #4f8cff;
    --accent-2: #8b5cf6;
    --bg: #0a0d14;
    --panel: rgba(15,20,30,.92);
    --text: #fff;
    --muted: #a8b3cf;
  }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: radial-gradient(1200px 600px at 50% 0%, #16233d 0%, var(--bg) 70%);
    color: var(--text);
    display: grid; place-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  /* ===== КОНТЕЙНЕР ПЛЕЕРА ===== */
  .player {
    position: relative;
    width: 100%;
    max-width: 1200px;
    aspect-ratio: 16/9;
    background: #000;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.06);
    user-select: none;
  }

  /* ===== ОБЁРТКА ДЛЯ IFRAME (обрезает стандартные контролы) ===== */
  .iframe-wrap {
    position: absolute;
    inset: 0;
    /* Небольшой сдвиг вниз, чтобы нижняя панель iframe ушла за границу */
    top: -0px;
    height: calc(100% + 60px); /* растягиваем, чтобы обрезать снизу */
    overflow: hidden;
  }

  iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
    pointer-events: none; /* клики пойдут по нашему оверлею */
  }

  /* ===== ОВЕРЛЕЙ ДЛЯ ПЕРЕХВАТА КЛИКОВ ===== */
  .click-overlay {
    position: absolute;
    inset: 0;
    z-index: 4;
    cursor: pointer;
    background: transparent;
  }

  /* ===== ЗАГРУЗЧИК ===== */
  .loader {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    background: rgba(0,0,0,.55);
    pointer-events: none; opacity: 0;
    transition: opacity .25s; z-index: 5;
  }
  .loader.show { opacity: 1; }
  .loader-spinner {
    width: 56px; height: 56px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.15);
    border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== БОЛЬШАЯ КНОПКА PLAY ===== */
  .center-play {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%,-50%) scale(.9);
    width: 84px; height: 84px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: none; cursor: pointer;
    display: grid; place-items: center;
    box-shadow: 0 20px 50px rgba(79,140,255,.5);
    opacity: 0; pointer-events: none;
    transition: opacity .3s, transform .3s;
    z-index: 6;
  }
  .center-play.show { opacity: 1; pointer-events: auto; transform: translate(-50%,-50%) scale(1); }
  .center-play:hover { transform: translate(-50%,-50%) scale(1.08); }
  .center-play svg { width: 36px; height: 36px; fill: #fff; margin-left: 4px; }

  /* ===== КАСТОМНЫЕ КОНТРОЛЫ ===== */
  .controls {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: linear-gradient(to top, rgba(0,0,0,.95) 0%, rgba(0,0,0,.7) 60%, transparent 100%);
    padding: 50px 18px 14px;
    z-index: 7;
    display: flex; align-items: center; gap: 10px;
    opacity: 0; transform: translateY(6px);
    transition: opacity .3s, transform .3s;
  }
  .controls.show { opacity: 1; transform: translateY(0); }

  .btn {
    width: 40px; height: 40px;
    border: none; background: transparent; color: #fff;
    cursor: pointer; border-radius: 9px;
    display: grid; place-items: center;
    transition: background .15s, transform .1s;
  }
  .btn:hover { background: rgba(255,255,255,.12); }
  .btn:active { transform: scale(.92); }
  .btn svg { width: 22px; height: 22px; fill: currentColor; pointer-events: none; }

  .time {
    font-size: 13px; color: #fff;
    font-variant-numeric: tabular-nums;
    padding: 0 6px;
    letter-spacing: .3px;
  }

  .volume-wrap { display: flex; align-items: center; gap: 4px; }
  .volume-slider {
    -webkit-appearance: none; appearance: none;
    width: 0; height: 4px;
    background: rgba(255,255,255,.25);
    border-radius: 4px; outline: none;
    transition: width .25s; cursor: pointer;
  }
  .volume-wrap:hover .volume-slider,
  .volume-slider:focus { width: 80px; }
  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 13px; height: 13px; border-radius: 50%;
    background: #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,.5);
    cursor: pointer;
  }

  .spacer { flex: 1; }

  /* ===== ВЕРХНЯЯ ПАНЕЛЬ С НАЗВАНИЕМ ===== */
  .top-bar {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 16px 18px;
    background: linear-gradient(to bottom, rgba(0,0,0,.75), transparent);
    display: flex; align-items: center; gap: 12px;
    z-index: 6; pointer-events: none;
    opacity: 0; transition: opacity .3s;
  }
  .top-bar.show { opacity: 1; }
  .top-bar .title {
    font-size: 14px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-shadow: 0 1px 3px rgba(0,0,0,.6);
  }

  /* ===== FLASH-ИКОНКА ПРИ ПАУЗЕ ===== */
  .click-flash {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    width: 80px; height: 80px; border-radius: 50%;
    background: rgba(0,0,0,.55);
    display: grid; place-items: center;
    opacity: 0; pointer-events: none; z-index: 5;
  }
  .click-flash svg { width: 40px; height: 40px; fill: #fff; }
  .click-flash.animate { animation: flashPulse .6s ease forwards; }
  @keyframes flashPulse {
    0% { opacity: 0; transform: translate(-50%,-50%) scale(.6); }
    20% { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%,-50%) scale(1.3); }
  }
</style>
</head>
<body>

<div class="player" id="player">
  <!-- Iframe с видео (обрезаем контролы снизу) -->
  <div class="iframe-wrap">
    <iframe
      id="rutube-frame"
      src="https://rutube.ru/play/embed/cae96c24f81419ccd444ed151a169985"
      allow="clipboard-write; autoplay"
      allowFullScreen
      sandbox="allow-scripts allow-same-origin allow-presentation"
    ></iframe>
  </div>

  <!-- Оверлей для перехвата кликов -->
  <div class="click-overlay" id="clickOverlay"></div>

  <!-- Верхняя панель -->
  <div class="top-bar" id="topBar">
    <div class="title" id="videoTitle">Rutube · Кастомный плеер</div>
  </div>

  <!-- Большая кнопка Play -->
  <button class="center-play" id="centerPlay" title="Воспроизвести">
    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
  </button>

  <!-- Flash-иконка -->
  <div class="click-flash" id="clickFlash">
    <svg id="flashIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
  </div>

  <!-- Загрузчик -->
  <div class="loader show" id="loader">
    <div class="loader-spinner"></div>
  </div>

  <!-- Кастомные контролы -->
  <div class="controls" id="controls">
    <button class="btn" id="playBtn" title="Играть / Пауза (Space)">
      <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>

    <div class="volume-wrap">
      <button class="btn" id="muteBtn" title="Звук (M)">
        <svg id="volIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.47 4.47 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/></svg>
      </button>
      <input type="range" class="volume-slider" id="volume" min="0" max="1" step="0.01" value="1">
    </div>

    <div class="time">
      <span id="curTime">0:00</span>
    </div>

    <div class="spacer"></div>

    <button class="btn" id="fsBtn" title="Полный экран (F)">
      <svg id="fsIcon" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
    </button>
  </div>
</div>

<script>
/* =========================================================
   ЭЛЕМЕНТЫ
   ========================================================= */
const iframe = document.getElementById('rutube-frame');
const player = document.getElementById('player');
const controls = document.getElementById('controls');
const topBar = document.getElementById('topBar');
const loader = document.getElementById('loader');
const centerPlay = document.getElementById('centerPlay');
const playBtn = document.getElementById('playBtn');
const playIcon = document.getElementById('playIcon');
const muteBtn = document.getElementById('muteBtn');
const volIcon = document.getElementById('volIcon');
const volumeEl = document.getElementById('volume');
const curTimeEl = document.getElementById('curTime');
const fsBtn = document.getElementById('fsBtn');
const fsIcon = document.getElementById('fsIcon');
const clickOverlay = document.getElementById('clickOverlay');
const clickFlash = document.getElementById('clickFlash');
const flashIcon = document.getElementById('flashIcon');

/* =========================================================
   ИКОНКИ
   ========================================================= */
const ICON_PLAY = 'M8 5v14l11-7z';
const ICON_PAUSE = 'M6 5h4v14H6zM14 5h4v14h-4z';
const ICON_VOL = 'M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.47 4.47 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z';
const ICON_MUTE = 'M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.8 8.8 0 0 0 21 12a8.99 8.99 0 0 0-7-8.77v2.06A7 7 0 0 1 19 12zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z';
const ICON_FS = 'M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z';
const ICON_FS_EX = 'M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z';

/* =========================================================
   СОСТОЯНИЕ
   ========================================================= */
let isPlaying = false;
let isMuted = false;
let lastVolume = 1;
let currentTime = 0;
let duration = 0;
let hideUITimer = null;
let timeUpdateInterval = null;

/* =========================================================
   ОТПРАВКА КОМАНД В IFRAME
   ========================================================= */
function sendCommand(type, data = {}) {
  try {
    iframe.contentWindow.postMessage(
      JSON.stringify({ type, data }),
      '*'
    );
  } catch (e) {
    console.warn('postMessage error:', e);
  }
}

/* =========================================================
   УПРАВЛЕНИЕ
   ========================================================= */
function play() {
  sendCommand('player:play');
  isPlaying = true;
  updatePlayUI();
  startTimeTracking();
}

function pause() {
  sendCommand('player:pause');
  isPlaying = false;
  updatePlayUI();
}

function stop() {
  sendCommand('player:stop');
  isPlaying = false;
  currentTime = 0;
  updatePlayUI();
  updateTimeUI();
  stopTimeTracking();
}

function togglePlay() {
  if (isPlaying) pause();
  else play();
}

/* Пропуск рекламы: сначала stop, потом play */
function bypassAds() {
  sendCommand('player:stop');
  setTimeout(() => {
    sendCommand('player:play');
    isPlaying = true;
    updatePlayUI();
  }, 500);
}

/* =========================================================
   UI ОБНОВЛЕНИЕ
   ========================================================= */
function updatePlayUI() {
  playIcon.querySelector('path').setAttribute('d', isPlaying ? ICON_PAUSE : ICON_PLAY);
  centerPlay.classList.toggle('show', !isPlaying);
  flashIcon.querySelector('path').setAttribute('d', isPlaying ? ICON_PAUSE : ICON_PLAY);
}

function updateVolumeUI() {
  volIcon.querySelector('path').setAttribute('d', (isMuted || volumeEl.value == 0) ? ICON_MUTE : ICON_VOL);
}

function fmt(sec) {
  if (!isFinite(sec) || sec < 0) sec = 0;
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = Math.floor(sec % 60);
  if (h > 0) return h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  return m + ':' + String(s).padStart(2, '0');
}

function updateTimeUI() {
  curTimeEl.textContent = fmt(currentTime);
}

/* =========================================================
   ТАЙМИНГ (эмуляция — реальное время из Rutube API)
   ========================================================= */
function startTimeTracking() {
  stopTimeTracking();
  timeUpdateInterval = setInterval(() => {
    // В реальном API можно запросить currentDuration,
    // но он возвращает только текущее время, поэтому эмулируем прирост
    if (isPlaying) {
      currentTime += 0.25;
      updateTimeUI();
    }
  }, 250);
}

function stopTimeTracking() {
  if (timeUpdateInterval) {
    clearInterval(timeUpdateInterval);
    timeUpdateInterval = null;
  }
}

/* =========================================================
   ОБРАБОТКА СООБЩЕНИЙ ОТ RUTUBE
   ========================================================= */
window.addEventListener('message', (e) => {
  if (!e.data) return;

  let msg;
  try {
    msg = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
  } catch {
    return;
  }

  // Rutube присылает события о состоянии плеера
  if (msg.type === 'player:state') {
    const state = msg.data;
    if (state === 'playing') { isPlaying = true; updatePlayUI(); }
    else if (state === 'paused') { isPlaying = false; updatePlayUI(); }
    else if (state === 'stopped') { isPlaying = false; updatePlayUI(); }
  }

  // Rutube может присылать время
  if (msg.type === 'player:timeupdate' && msg.data && typeof msg.data.time === 'number') {
    currentTime = msg.data.time;
    updateTimeUI();
  }

  // Rutube может присылать длительность
  if (msg.type === 'player:duration' && msg.data && typeof msg.data.duration === 'number') {
    duration = msg.data.duration;
  }

  // Реклама началась
  if (msg.type === 'ad:started') {
    loader.classList.add('show');
  }
  if (msg.type === 'ad:ended') {
    loader.classList.remove('show');
  }
});

/* =========================================================
   КНОПКИ
   ========================================================= */
playBtn.addEventListener('click', togglePlay);
centerPlay.addEventListener('click', togglePlay);

muteBtn.addEventListener('click', () => {
  isMuted = !isMuted;
  if (isMuted) {
    lastVolume = volumeEl.value;
    sendCommand('player:mute');
  } else {
    sendCommand('player:unMute');
  }
  updateVolumeUI();
});

volumeEl.addEventListener('input', () => {
  const v = parseFloat(volumeEl.value);
  isMuted = v === 0;
  sendCommand('player:volume', { volume: v });
  updateVolumeUI();
});

fsBtn.addEventListener('click', () => {
  if (!document.fullscreenElement) player.requestFullscreen?.().catch(() => {});
  else document.exitFullscreen?.();
});

document.addEventListener('fullscreenchange', () => {
  const fs = !!document.fullscreenElement;
  fsIcon.querySelector('path').setAttribute('d', fs ? ICON_FS_EX : ICON_FS);
});

/* =========================================================
   КЛИК ПО ОВЕРЛЕЮ — ПАУЗА
   ========================================================= */
clickOverlay.addEventListener('click', () => {
  togglePlay();
  clickFlash.classList.remove('animate');
  void clickFlash.offsetWidth;
  clickFlash.classList.add('animate');
});

/* =========================================================
   АВТО-СКРЫТИЕ UI
   ========================================================= */
function pokeUI() {
  controls.classList.add('show');
  topBar.classList.add('show');
  clearTimeout(hideUITimer);
  hideUITimer = setTimeout(() => {
    controls.classList.remove('show');
    topBar.classList.remove('show');
  }, 3000);
}

player.addEventListener('mousemove', pokeUI);
player.addEventListener('mouseleave', () => {
  controls.classList.remove('show');
  topBar.classList.remove('show');
});
player.addEventListener('click', pokeUI);
pokeUI();

/* =========================================================
   ГОРЯЧИЕ КЛАВИШИ
   ========================================================= */
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  switch (e.code) {
    case 'Space':
    case 'KeyK':
      e.preventDefault();
      togglePlay();
      break;
    case 'KeyM':
      muteBtn.click();
      break;
    case 'KeyF':
      fsBtn.click();
      break;
    case 'KeyS':
      stop();
      break;
    case 'KeyB':
      bypassAds();
      break;
  }
  pokeUI();
});

/* =========================================================
   ИНИЦИАЛИЗАЦИЯ
   ========================================================= */
function init() {
  // Эмулируем готовность плеера
  setTimeout(() => {
    loader.classList.remove('show');
    updatePlayUI();
    updateVolumeUI();
    updateTimeUI();
    // Автозапуск
    play();
  }, 1500);
}

init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HLS Плеер</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<style>
  body { margin: 0; background: #0a0d14; color: #fff; font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; }
  .player { position: relative; width: 100%; max-width: 1000px; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 30px 70px rgba(0,0,0,.7); }
  video { width: 100%; height: 100%; display: block; background: #000; }
  .info { position: absolute; top: 12px; left: 12px; padding: 8px 14px; background: rgba(0,0,0,.75); border-radius: 6px; font-size: 12px; z-index: 5; line-height: 1.5; max-width: 90%; }
  .info b { color: #4f8cff; }
</style>
</head>
<body>

<div class="player" id="player">
  <video id="video" playsinline controls></video>
  <div class="info" id="info">Загрузка…</div>
</div>

<script>
const VIDEO_URL = 'https://shadow.z.superdupercdn.com/movies/131af5d5f5a3c28f083ad9010857dfdea67e36c4/d4c250765d35ac079e8c41f4b8f29294:2026092702/hls.m3u8';

const video = document.getElementById('video');
const info = document.getElementById('info');

function log(msg) {
  console.log(msg);
  info.innerHTML = msg;
}

if (window.Hls && Hls.isSupported()) {
  const hls = new Hls({ enableWorker: true });

  hls.loadSource(VIDEO_URL);
  hls.attachMedia(video);

  hls.on(Hls.Events.MANIFEST_PARSED, (evt, data) => {
    console.log('=== MANIFEST PARSED ===');
    console.log('Уровней:', data.levels.length);
    console.log('Полные данные:', data);

    let report = `<b>Манифест загружен</b><br>`;
    report += `Уровней качества: ${data.levels.length}<br>`;

    data.levels.forEach((lv, i) => {
      const video = lv.videoCodec ? `видео: ${lv.videoCodec}` : 'видео: НЕТ';
      const audio = lv.audioCodec ? `аудио: ${lv.audioCodec}` : 'аудио: НЕТ';
      const size = lv.width && lv.height ? `${lv.width}×${lv.height}` : 'размер: N/A';
      const bitrate = lv.bitrate ? `${Math.round(lv.bitrate/1000)} kbps` : '';
      report += `<br>Уровень ${i}: ${video}, ${audio}, ${size} ${bitrate}`;
      console.log(`Уровень ${i}:`, lv);
    });

    info.innerHTML = report;
    video.play().catch(()=>{});
  });

  hls.on(Hls.Events.ERROR, (evt, data) => {
    console.error('=== HLS ERROR ===');
    console.error(data);

    if (data.fatal) {
      let msg = `<b style="color:#ff5566">Ошибка</b><br>`;
      msg += `Тип: ${data.type}<br>`;
      msg += `Детали: ${data.details}<br>`;
      msg += `HTTP код: ${data.response?.code || 'N/A'}<br>`;
      info.innerHTML = msg;
    } else {
      // Не фатальная — просто логируем
      console.warn('Нефатальная ошибка:', data.details);
    }
  });

  // Логируем, когда начинают приходить фрагменты
  hls.on(Hls.Events.FRAG_LOADED, (evt, data) => {
    console.log('Фрагмент загружен:', data.frag.sn, data.frag.url);
  });

  hls.on(Hls.Events.LEVEL_LOADED, (evt, data) => {
    console.log('Плейлист уровня загружен:', data.details);
  });

} else if (video.canPlayType('application/vnd.apple.mpegurl')) {
  video.src = VIDEO_URL;
  info.textContent = 'Нативный HLS (Safari)';
} else {
  info.textContent = 'HLS не поддерживается';
}

video.addEventListener('loadedmetadata', () => {
  console.log('=== METADATA ===');
  console.log({
    videoWidth: video.videoWidth,
    videoHeight: video.videoHeight,
    duration: video.duration,
  });
  info.innerHTML += `<br><br><b>Размер видео:</b> ${video.videoWidth}×${video.videoHeight}<br>`;
  info.innerHTML += `<b>Длительность:</b> ${Math.round(video.duration)} сек`;
});

video.addEventListener('error', (e) => {
  console.error('=== VIDEO ERROR ===', video.error);
  info.innerHTML += `<br><b style="color:#ff5566">Ошибка видео:</b> код ${video.error?.code}`;
});
</script>
</body>
</html>

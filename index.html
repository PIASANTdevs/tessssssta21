<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VK Video — кастомный плеер</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --accent: #4f8cff;
    --accent-2: #8b5cf6;
    --bg: #0a0d14;
    --text: #fff;
    --muted: #a8b3cf;
  }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: radial-gradient(1200px 600px at 50% 0%, #16233d 0%, var(--bg) 70%);
    color: var(--text);
    display: grid; place-items: center;
    min-height: 100vh; padding: 20px;
  }

  .player {
    position: relative;
    width: 100%; max-width: 1200px;
    aspect-ratio: 16/9;
    background: #000;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.06);
    user-select: none;
  }

  video {
    width: 100%; height: 100%; display: block;
    background: #000; object-fit: contain;
  }

  .poster {
    position: absolute; inset: 0;
    background: linear-gradient(135deg, #1a2332, #0a0d14);
    display: grid; place-items: center;
    z-index: 3;
    transition: opacity .4s;
    cursor: pointer;
  }
  .poster.hide { opacity: 0; pointer-events: none; }
  .poster::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 50%, rgba(79,140,255,.15), transparent 70%);
  }
  .poster-content { position: relative; z-index: 2; text-align: center; padding: 20px; }
  .poster-play {
    width: 96px; height: 96px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: none; cursor: pointer;
    display: grid; place-items: center;
    box-shadow: 0 20px 50px rgba(79,140,255,.5);
    transition: transform .3s;
    margin: 0 auto 20px;
  }
  .poster-play:hover { transform: scale(1.08); }
  .poster-play svg { width: 40px; height: 40px; fill: #fff; margin-left: 6px; }
  .poster-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; text-shadow: 0 2px 12px rgba(0,0,0,.9); }
  .poster-sub { font-size: 13px; color: var(--muted); }

  .loader {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    background: rgba(0,0,0,.6);
    pointer-events: none; opacity: 0;
    transition: opacity .25s; z-index: 5;
  }
  .loader.show { opacity: 1; }
  .loader-spinner {
    width: 56px; height: 56px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.15);
    border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error {
    position: absolute; inset: 0;
    display: none; place-items: center;
    background: rgba(6,9,15,.95);
    text-align: center; padding: 24px; z-index: 8;
  }
  .error.show { display: grid; }
  .error .icon { font-size: 52px; margin-bottom: 12px; }
  .error h3 { font-size: 18px; margin-bottom: 8px; }
  .error p { font-size: 13px; color: var(--muted); max-width: 480px; line-height: 1.5; word-break: break-word; }
  .error .retry {
    margin-top: 16px; padding: 10px 26px; border-radius: 10px; border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
  }

  .click-flash {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    width: 80px; height: 80px; border-radius: 50%;
    background: rgba(0,0,0,.55);
    display: grid; place-items: center;
    opacity: 0; pointer-events: none; z-index: 5;
  }
  .click-flash svg { width: 40px; height: 40px; fill: #fff; }
  .click-flash.animate { animation: flashPulse .6s ease forwards; }
  @keyframes flashPulse {
    0% { opacity: 0; transform: translate(-50%,-50%) scale(.6); }
    20% { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%,-50%) scale(1.3); }
  }

  .top-bar {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 16px 18px;
    background: linear-gradient(to bottom, rgba(0,0,0,.8), transparent);
    display: flex; align-items: center; gap: 12px;
    z-index: 6; pointer-events: none;
    opacity: 0; transition: opacity .3s;
  }
  .top-bar.show { opacity: 1; }
  .top-bar .title {
    font-size: 14px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .controls {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: linear-gradient(to top, rgba(0,0,0,.95) 0%, rgba(0,0,0,.7) 60%, transparent 100%);
    padding: 50px 18px 14px;
    z-index: 7;
    opacity: 0; transform: translateY(6px);
    transition: opacity .3s, transform .3s;
  }
  .controls.show { opacity: 1; transform: translateY(0); }

  .progress-wrap {
    position: relative; height: 20px;
    display: flex; align-items: center;
    cursor: pointer; margin-bottom: 8px;
  }
  .progress-track {
    position: relative; width: 100%; height: 4px;
    background: rgba(255,255,255,.2);
    border-radius: 4px; overflow: hidden;
    transition: height .15s;
  }
  .progress-wrap:hover .progress-track { height: 7px; }
  .progress-buffered {
    position: absolute; top: 0; left: 0; bottom: 0;
    background: rgba(255,255,255,.25); width: 0%;
  }
  .progress-played {
    position: absolute; top: 0; left: 0; bottom: 0;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    width: 0%;
  }
  .progress-thumb {
    position: absolute; top: 50%; left: 0;
    width: 14px; height: 14px; border-radius: 50%;
    background: #fff;
    transform: translate(-50%,-50%) scale(0);
    transition: transform .15s; pointer-events: none;
  }
  .progress-wrap:hover .progress-thumb { transform: translate(-50%,-50%) scale(1); }
  .preview-time {
    position: absolute; bottom: 26px;
    transform: translateX(-50%);
    padding: 4px 10px;
    background: rgba(0,0,0,.9);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 6px;
    font-size: 12px; font-weight: 600;
    opacity: 0; transition: opacity .15s;
    pointer-events: none; white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .progress-wrap:hover .preview-time { opacity: 1; }

  .row { display: flex; align-items: center; gap: 10px; }

  .btn {
    width: 40px; height: 40px;
    border: none; background: transparent; color: #fff;
    cursor: pointer; border-radius: 9px;
    display: grid; place-items: center;
    transition: background .15s, transform .1s;
  }
  .btn:hover { background: rgba(255,255,255,.12); }
  .btn:active { transform: scale(.92); }
  .btn svg { width: 22px; height: 22px; fill: currentColor; pointer-events: none; }

  .time { font-size: 13px; font-variant-numeric: tabular-nums; padding: 0 6px; }
  .time .sep { color: rgba(255,255,255,.4); margin: 0 4px; }

  .volume-wrap { display: flex; align-items: center; gap: 4px; }
  .volume-slider {
    -webkit-appearance: none; width: 0; height: 4px;
    background: rgba(255,255,255,.25); border-radius: 4px;
    transition: width .25s; cursor: pointer; outline: none;
  }
  .volume-wrap:hover .volume-slider { width: 80px; }
  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 13px; height: 13px; border-radius: 50%;
    background: #fff;
  }

  .spacer { flex: 1; }

  .quality { position: relative; }
  .quality-btn { width: auto; padding: 0 12px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .quality-menu {
    position: absolute; bottom: 100%; right: 0;
    margin-bottom: 8px; min-width: 90px;
    background: rgba(15,20,30,.96);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 10px; padding: 6px;
    opacity: 0; transform: translateY(6px); pointer-events: none;
    transition: .2s;
  }
  .quality-menu.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .quality-menu .opt {
    padding: 8px 12px; font-size: 13px; font-weight: 600;
    cursor: pointer; border-radius: 6px;
    display: flex; justify-content: space-between; gap: 12px;
  }
  .quality-menu .opt:hover { background: rgba(255,255,255,.08); }
  .quality-menu .opt.active { color: var(--accent); }
  .quality-menu .opt.active::after { content: '✓'; }

  @media (max-width: 600px) {
    body { padding: 10px; }
    .btn { width: 36px; height: 36px; }
    .btn svg { width: 20px; height: 20px; }
    .poster-play { width: 72px; height: 72px; }
    .poster-play svg { width: 30px; height: 30px; }
  }
</style>
</head>

let hls = null;

/* ================== ЗАГРУЗКА ================== */
function loadVideo() {
  errorBox.classList.remove('show');
  loader.classList.add('show');

  if (window.Hls && Hls.isSupported()) {
    if (hls) { try { hls.destroy(); } catch(e){} }

    hls = new Hls({
      enableWorker: true,
      lowLatencyMode: false,
      backBufferLength: 60
    });

    hls.loadSource(VIDEO_URL);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, (evt, data) => {
      loader.classList.remove('show');
      buildQualityMenu(data.levels);
      video.play().catch(() => {});
    });

    hls.on(Hls.Events.LEVEL_SWITCHED, (evt, data) => {
      updateQualityLabel(data.level);
    });

    hls.on(Hls.Events.ERROR, (evt, data) => {
      if (!data.fatal) return;
      console.error('HLS error:', data);
      switch (data.type) {
        case Hls.ErrorTypes.NETWORK_ERROR:
          hls.startLoad();
          break;
        case Hls.ErrorTypes.MEDIA_ERROR:
          hls.recoverMediaError();
          break;
        default:
          showError('Ошибка: ' + data.details);
          break;
      }
    });

  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = VIDEO_URL;
    video.addEventListener('loadedmetadata', () => {
      loader.classList.remove('show');
      video.play().catch(() => {});
    }, { once: true });
  } else {
    showError('Браузер не поддерживает HLS.');
  }
}

function showError(msg) {
  loader.classList.remove('show');
  errorText.textContent = msg;
  errorBox.classList.add('show');
}
retryBtn.addEventListener('click', () => { errorBox.classList.remove('show'); loadVideo(); });

/* ================== КАЧЕСТВО ================== */
function buildQualityMenu(levels) {
  qualityMenu.innerHTML = '';
  const autoOpt = document.createElement('div');
  autoOpt.className = 'opt active';
  autoOpt.dataset.level = '-1';
  autoOpt.textContent = 'Auto';
  qualityMenu.appendChild(autoOpt);

  levels.map((lv, idx) => ({ lv, idx }))
    .sort((a, b) => (b.lv.height || 0) - (a.lv.height || 0))
    .forEach(({ lv, idx }) => {
      const opt = document.createElement('div');
      opt.className = 'opt';
      opt.dataset.level = String(idx);
      opt.textContent = lv.height ? lv.height + 'p' : Math.round(lv.bitrate / 1000) + 'k';
      qualityMenu.appendChild(opt);
    });

  qualityMenu.querySelectorAll('.opt').forEach(opt => {
    opt.addEventListener('click', (e) => {
      e.stopPropagation();
      if (hls) hls.currentLevel = parseInt(opt.dataset.level, 10);
      qualityMenu.querySelectorAll('.opt').forEach(o => o.classList.remove('active'));
      opt.classList.add('active');
      qualityMenu.classList.remove('show');
    });
  });

  qLabel.textContent = 'Auto';
}
function updateQualityLabel(i) {
  if (!hls || !hls.levels) return;
  if (hls.autoLevelEnabled) { qLabel.textContent = 'Auto'; return; }
  const lv = hls.levels[i];
  if (lv) qLabel.textContent = lv.height ? lv.height + 'p' : Math.round(lv.bitrate / 1000) + 'k';
}
qualityBtn.addEventListener('click', (e) => { e.stopPropagation(); qualityMenu.classList.toggle('show'); });
document.addEventListener('click', () => qualityMenu.classList.remove('show'));

/* ================== PLAY / PAUSE ================== */
function togglePlay() { video.paused ? video.play().catch(()=>{}) : video.pause(); }
playBtn.addEventListener('click', togglePlay);
posterPlay.addEventListener('click', (e) => { e.stopPropagation(); poster.classList.add('hide'); video.play().catch(()=>{}); });
poster.addEventListener('click', () => { poster.classList.add('hide'); video.play().catch(()=>{}); });
video.addEventListener('play', () => { playIcon.querySelector('path').setAttribute('d', ICON_PAUSE); poster.classList.add('hide'); });
video.addEventListener('pause', () => playIcon.querySelector('path').setAttribute('d', ICON_PLAY));

video.addEventListener('click', (e) => {
  if (e.target !== video) return;
  togglePlay();
  flashIcon.querySelector('path').setAttribute('d', video.paused ? ICON_PAUSE : ICON_PLAY);
  clickFlash.classList.remove('animate');
  void clickFlash.offsetWidth;
  clickFlash.classList.add('animate');
});

/* ================== ЗВУК ================== */
function updateVolUI() {
  const m = video.muted || video.volume === 0;
  volIcon.querySelector('path').setAttribute('d', m ? ICON_MUTE : ICON_VOL);
  volumeEl.value = m ? 0 : video.volume;
}
muteBtn.addEventListener('click', () => { video.muted = !video.muted; if (!video.muted && video.volume === 0) video.volume = 0.7; updateVolUI(); });
volumeEl.addEventListener('input', () => { video.volume = parseFloat(volumeEl.value); video.muted = video.volume === 0; updateVolUI(); });
video.addEventListener('volumechange', updateVolUI);

/* ================== ПРОГРЕСС ================== */
function fmt(s) {
  if (!isFinite(s) || s < 0) s = 0;
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = Math.floor(s%60);
  return h > 0 ? `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}` : `${m}:${String(sec).padStart(2,'0')}`;
}
function updateProgress() {
  const d = video.duration || 0, c = video.currentTime || 0;
  const p = d ? (c/d)*100 : 0;
  progressPlayed.style.width = p + '%';
  progressThumb.style.left = p + '%';
  curTimeEl.textContent = fmt(c);
  if (video.buffered.length) {
    const e = video.buffered.end(video.buffered.length - 1);
    progressBuffered.style.width = (d ? (e/d)*100 : 0) + '%';
  }
}
video.addEventListener('timeupdate', updateProgress);
video.addEventListener('progress', updateProgress);
video.addEventListener('loadedmetadata', () => { durTimeEl.textContent = fmt(video.duration); });

function seek(e) {
  const r = progressWrap.getBoundingClientRect();
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
  const ratio = Math.max(0, Math.min(1, x / r.width));
  if (video.duration) video.currentTime = ratio * video.duration;
}
progressWrap.addEventListener('mousedown', e => {
  seek(e);
  const move = ev => seek(ev);
  const up = () => { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); };
  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', up);
});
progressWrap.addEventListener('mousemove', e => {
  const r = progressWrap.getBoundingClientRect();
  const ratio = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
  previewTime.style.left = (ratio * 100) + '%';
  previewTime.textContent = fmt(ratio * (video.duration || 0));
});

/* ================== FS / PiP ================== */
fsBtn.addEventListener('click', () => {
  if (!document.fullscreenElement) player.requestFullscreen?.().catch(()=>{});
  else document.exitFullscreen?.();
});
document.addEventListener('fullscreenchange', () => {
  const fs = !!document.fullscreenElement;
  fsIcon.querySelector('path').setAttribute('d', fs ? ICON_FS_EX : ICON_FS);
});
pipBtn.addEventListener('click', async () => {
  try {
    if (document.pictureInPictureElement) await document.exitPictureInPicture();
    else await video.requestPictureInPicture();
  } catch(e){}
});

/* ================== UI ================== */
function pokeUI() {
  controls.classList.add('show');
  topBar.classList.add('show');
  clearTimeout(hideUITimer);
  hideUITimer = setTimeout(() => {
    if (!video.paused) { controls.classList.remove('show'); topBar.classList.remove('show'); }
  }, 3000);
}
player.addEventListener('mousemove', pokeUI);
player.addEventListener('mouseleave', () => { if (!video.paused) { controls.classList.remove('show'); topBar.classList.remove('show'); } });
player.addEventListener('click', pokeUI);
pokeUI();

/* ================== КЛАВИШИ ================== */
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  switch (e.code) {
    case 'Space': case 'KeyK': e.preventDefault(); togglePlay(); break;
    case 'ArrowLeft': e.preventDefault(); video.currentTime = Math.max(0, video.currentTime - 5); break;
    case 'ArrowRight': e.preventDefault(); video.currentTime = Math.min(video.duration||0, video.currentTime + 5); break;
    case 'ArrowUp': e.preventDefault(); video.volume = Math.min(1, video.volume + .05); break;
    case 'ArrowDown': e.preventDefault(); video.volume = Math.max(0, video.volume - .05); break;
    case 'KeyM': muteBtn.click(); break;
    case 'KeyF': fsBtn.click(); break;
    case 'KeyP': pipBtn.click(); break;
  }
  pokeUI();
});

/* ================== СТАРТ ================== */
video.volume = 1;
updateVolUI();
loadVideo();
</script>
</body>
</html>
